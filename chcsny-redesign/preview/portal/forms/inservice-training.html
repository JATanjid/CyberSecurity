   {
    "type": "lesson",
    "title": "Hepatitis B Vaccine Program",
    "html": "<p>Hepatitis B is the bloodborne infection home care workers are most likely to get from a needlestick, and it is <strong>preventable<\/strong>.<\/p>\n<div class=\"g-stats\">\n<div><b>$0<\/b><span>Cost to the employee<\/span><\/div>\n<div><b>10 days<\/b><span>Offered within 10 working days of assignment<\/span><\/div>\n<div><b>2\u20133<\/b><span>Doses in the series, depending on the vaccine<\/span><\/div>\n<div><b>90%+<\/b><span>Of people protected after the full series<\/span><\/div>\n<\/div>\n<ul class=\"g-check\"><li>The vaccine is offered free to all employees with occupational exposure, after training and within 10 working days of initial assignment.<\/li><li>You may <strong>decline<\/strong> by signing the OSHA declination form, and you may change your mind later and still get it free.<\/li><li>Bring proof if you were already vaccinated or have immunity (titer).<\/li><li>Finish all doses on schedule for full protection.<\/li><li>The vaccine is safe. It does not contain live virus and cannot cause hepatitis B.<\/li><\/ul>"
   },
   {
    "type": "lesson",
    "title": "Infection & Exposure Control in the Home",
    "html": "<p>Infection control continues outside the patient's body: in the bathroom, the kitchen, and the equipment you use.<\/p>\n<div class=\"g-icons\">\n<div><i>\ud83e\uddfd<\/i><h4>Clean, then disinfect<\/h4><p>Clean high-touch surfaces (bed rails, commode, doorknobs, phones) and follow the disinfectant's contact time.<\/p><\/div>\n<div><i>\ud83e\ude7a<\/i><h4>Equipment<\/h4><p>Clean shared equipment (thermometers, BP cuffs, walkers) between uses. Use dedicated equipment for patients on contact precautions.<\/p><\/div>\n<div><i>\ud83e\udd12<\/i><h4>Work healthy<\/h4><p>Do not work with fever, vomiting, diarrhea, or an uncovered draining wound. Call the office.<\/p><\/div>\n<div><i>\ud83d\udecd\ufe0f<\/i><h4>Your bag<\/h4><p>Keep personal items in a clean bag. Place it on a clean, dry surface, not the floor or bed.<\/p><\/div>\n<div><i>\ud83d\udc55<\/i><h4>Uniform<\/h4><p>Change and launder work clothes daily, separately if soiled.<\/p><\/div>\n<div><i>\ud83d\udcde<\/i><h4>Report<\/h4><p>Report signs of infection (fever, redness, pus, new cough, diarrhea) to your RN.<\/p><\/div>\n<\/div>\n<h3>OSHA, HIPAA &amp; HIV/AIDS confidentiality<\/h3>\n<p>OSHA protects <strong>you<\/strong> at work. HIPAA and NYS Public Health Law Article 27-F protect the <strong>patient's information<\/strong>. Exposure reports and medical records are confidential. A patient's HIV status is shared only as allowed by law or with specific written authorization. Never discuss any patient's infection status with people who do not need to know.<\/p>"
   },
   {
    "type": "lesson",
    "title": "Bed Bug Safety",
    "html": "<p>Bed bugs do not spread disease, but bites cause itching and distress, and the bugs are easily carried from home to home in bags and clothing.<\/p>\n<div class=\"g-icons\">\n<div><i>\ud83d\udd0d<\/i><h4>Look for signs<\/h4><p>Small reddish-brown bugs, rusty spots on sheets and mattress seams, shed skins, and itchy bites in a line.<\/p><\/div>\n<div><i>\ud83c\udf92<\/i><h4>Bring less<\/h4><p>Bring only what you need, sealed in a plastic bag. Keep your bag off beds, sofas, and the floor near the bed.<\/p><\/div>\n<div><i>\ud83e\ude91<\/i><h4>Hard surfaces<\/h4><p>Sit on hard chairs, not upholstered furniture.<\/p><\/div>\n<div><i>\ud83e\udde5<\/i><h4>Protective clothing<\/h4><p>Wear a disposable gown or shoe covers if the agency provides them for an infested home.<\/p><\/div>\n<div><i>\ud83d\udd25<\/i><h4>Heat kills<\/h4><p>At home, put work clothes straight into the dryer on <strong>high heat for at least 30 minutes<\/strong>.<\/p><\/div>\n<div><i>\ud83d\udce3<\/i><h4>Report<\/h4><p>Report suspected bed bugs to your supervisor so the agency can arrange help. Do not spray pesticides yourself.<\/p><\/div>\n<\/div>"
   },
   {
    "type": "lesson",
    "title": "COVID-19 Precaution & Prevention",
    "html": "<p>COVID-19 is a respiratory virus spread mainly through respiratory droplets and small airborne particles, and sometimes by touching contaminated surfaces. Older and immunocompromised patients face the highest risk of severe illness.<\/p>\n<div class=\"g-icons\">\n<div><i>\ud83d\udc89<\/i><h4>Stay up to date<\/h4><p>Vaccination lowers the risk of severe illness. Ask the office about current vaccines.<\/p><\/div>\n<div><i>\ud83c\udf21\ufe0f<\/i><h4>Screen yourself<\/h4><p>Before each shift, check for fever, cough, sore throat, loss of taste or smell, or body aches.<\/p><\/div>\n<div><i>\ud83d\ude37<\/i><h4>Mask when required<\/h4><p>Wear a well-fitting mask or N95 as directed by agency policy, especially if you or the patient has symptoms.<\/p><\/div>\n<div><i>\ud83e\uddfc<\/i><h4>Hand hygiene<\/h4><p>Before and after care, after coughing, and after touching your face or mask.<\/p><\/div>\n<div><i>\ud83e\ude9f<\/i><h4>Ventilation<\/h4><p>Open a window when it is safe and weather permits, to improve air flow.<\/p><\/div>\n<div><i>\ud83d\udcde<\/i><h4>Sick? Stay home<\/h4><p>Notify the office, test as directed, and follow current CDC and NYS DOH return-to-work guidance.<\/p><\/div>\n<\/div>\n<div class=\"g-note\"><p>Guidance changes over time. Always follow the <strong>current agency policy<\/strong>, which reflects current CDC and New York State Department of Health recommendations.<\/p><\/div>"
   },

   {
    "type": "lesson",
    "title": "Other Infection & Safety Topics: Emergency, Fire & Hospice",
    "html": "<div class=\"g-icons two\">\n<div><i>\ud83c\udf2a\ufe0f<\/i><h4>Emergency Disaster Policy<\/h4><p>Keep your contact information current, know your patients' priority levels, report your availability when an emergency is declared, and follow assignments. (Full detail is in the Disaster and Emergency Preparedness in-service.)<\/p><\/div>\n<div><i>\ud83d\udd25<\/i><h4>Fire Safety<\/h4><p>RACE: Rescue, Alarm, Contain, Evacuate. PASS for extinguishers: Pull, Aim, Squeeze, Sweep. Keep oxygen 10 feet from flames.<\/p><\/div>\n<div><i>\ud83d\udd4a\ufe0f<\/i><h4>Hospice Care<\/h4><p>Comfort-focused care for patients with a limited life expectancy. Standard precautions still apply. Provide gentle care, respect the patient's wishes, and report pain and changes to the hospice team.<\/p><\/div>\n<div><i>\ud83d\udd10<\/i><h4>OSHA / HIPAA<\/h4><p>Follow OSHA safety rules to protect yourself, and HIPAA rules to protect patient privacy, on every visit.<\/p><\/div>\n<\/div>"
   },
   {
    "type": "lesson",
    "title": "TB Program in Practice: Screening, Latent vs. Active TB & Respirators",
    "html": "<div class=\"g-do\">\n<div class=\"do\"><h4>Latent TB infection<\/h4><ul><li>TB germs are in the body but \"asleep.\"<\/li><li>No symptoms. <strong>Not contagious.<\/strong><\/li><li>Positive skin or blood test, normal chest X-ray.<\/li><li>Treatment prevents it from becoming active.<\/li><\/ul><\/div>\n<div class=\"dont\"><h4>Active TB disease<\/h4><ul><li>Germs are multiplying and causing illness.<\/li><li>Cough over 3 weeks, fever, night sweats, weight loss.<\/li><li><strong>Contagious<\/strong> when in the lungs or throat.<\/li><li>Requires months of medication and airborne precautions.<\/li><\/ul><\/div>\n<\/div>\n<h3>Screening tests<\/h3>\n<div class=\"g-icons two\">\n<div><i>\ud83d\udc89<\/i><h4>Tuberculin skin test (TST/PPD)<\/h4><p>A small injection under the skin of the forearm. It <strong>must be read in 48\u201372 hours<\/strong>. Return on time, or the test must be repeated.<\/p><\/div>\n<div><i>\ud83e\uddea<\/i><h4>Blood test (IGRA)<\/h4><p>For example, QuantiFERON. A single blood draw, with no return visit needed.<\/p><\/div>\n<\/div>\n<h3>N95 respirator: fit test and seal check<\/h3>\n<div class=\"g-steps\">\n<div><h4>Fit test<\/h4><p>Done by the agency to find the right make and size for your face. Repeat it if your face shape changes.<\/p><\/div>\n<div><h4>Put it on<\/h4><p>Cup it over your nose and mouth. Top strap high on the head, bottom strap at the neck.<\/p><\/div>\n<div><h4>Mold the nosepiece<\/h4><p>Press with both hands. Never pinch with one hand.<\/p><\/div>\n<div><h4>Seal check every time<\/h4><p>Breathe out sharply: there should be no air leaks at the edges. Breathe in: the mask should pull in slightly.<\/p><\/div>\n<\/div>\n<div class=\"g-note\"><p>Facial hair under the seal prevents an N95 from protecting you. Surgical masks do <strong>not<\/strong> protect you from TB.<\/p><\/div>"
   },

    "type": "lesson",
    "title": "Preventing Sharps Injuries",
    "html": "<div class=\"g-stats\">\n<div><b>Never<\/b><span>Recap a used needle<\/span><\/div>\n<div><b>\u00be full<\/b><span>Close and replace the sharps container<\/span><\/div>\n<div><b>Immediately<\/b><span>Dispose of sharps right after use<\/span><\/div>\n<\/div>\n<ul class=\"g-check\"><li>Keep the sharps container close to where sharps are used (for example, insulin pens or lancets).<\/li><li>Never reach into a sharps container or push items down.<\/li><li>Watch for needles left in bedding, on tables, or in the trash. Pick them up with a tool, never your fingers.<\/li><li>Use safety-engineered devices when provided, and activate the safety feature right away.<\/li><li>Report every sharps injury, even if it seems minor.<\/li><\/ul>\n<div class=\"g-note\"><p>Home Health Aides do not give injections. But you may handle used lancets or pen needles and must dispose of them safely if they are left out.<\/p><\/div>"
   },
   {
    "type": "lesson",
    "title": "Cleaning a Blood Spill: Step by Step",
    "html": "<div class=\"g-steps\">\n<div><h4>Protect yourself<\/h4><p>Put on gloves (and eye protection or a gown if splashing is possible). Keep others away.<\/p><\/div>\n<div><h4>Absorb<\/h4><p>Cover the spill with paper towels to soak it up. Pick up broken glass with tongs or a dustpan, never your hands.<\/p><\/div>\n<div><h4>Clean<\/h4><p>Remove the soiled towels into a plastic bag. Clean the area with soap and water.<\/p><\/div>\n<div><h4>Disinfect<\/h4><p>Apply a freshly mixed <strong>1:10 bleach solution<\/strong> (1 part bleach to 9 parts water) or an EPA-registered disinfectant. Leave it wet for the label's contact time.<\/p><\/div>\n<div><h4>Dispose<\/h4><p>Bag all waste, tie it, double-bag it, and place it in the household trash.<\/p><\/div>\n<div><h4>Remove PPE &amp; wash hands<\/h4><p>Remove gloves first, then wash hands with soap and water.<\/p><\/div>\n<\/div>\n<div class=\"g-warn\"><p>Mix bleach solution fresh each day, in a ventilated area. Never mix bleach with ammonia, vinegar, or other cleaners, because it creates toxic gas.<\/p><\/div>"
   },

    "title": "Case Studies: Infection & Safety",
    "html": "<div class=\"g-scenario\"><h4>Case 1<\/h4><p>While changing a dressing, the patient's blood splashes into your eye.<\/p>\n<details><summary>See the answer<\/summary><p>Flush the eye immediately with clean water or saline for several minutes. Report to your supervisor right away, and go for same-day medical evaluation. Complete an exposure report. This is a significant risk exposure.<\/p><\/details><\/div>\n<div class=\"g-scenario\"><h4>Case 2<\/h4><p>Your patient has had a productive cough for a month, night sweats, and has lost weight. No one has mentioned TB.<\/p>\n<details><summary>See the answer<\/summary><p>Report the symptoms to your RN supervisor right away. Wear an N95 if directed, and encourage the patient to cover their cough. The nurse will contact the provider about testing.<\/p><\/details><\/div>\n<div class=\"g-scenario\"><h4>Case 3<\/h4><p>The patient has C. diff diarrhea. You have alcohol hand rub in your bag.<\/p>\n<details><summary>See the answer<\/summary><p>Alcohol does not kill C. diff spores. Wash your hands with soap and water. Use gloves and a gown for contact precautions, and clean the bathroom with a bleach-based disinfectant as directed.<\/p><\/details><\/div>\n<div class=\"g-scenario\"><h4>Case 4<\/h4><p>You declined the Hepatitis B vaccine last year but have now changed your mind.<\/p>\n<details><summary>See the answer<\/summary><p>Tell the office. You can still receive the vaccine series at no cost.<\/p><\/details><\/div>"

   {
    "type": "lesson",
    "title": "Disaster & Emergency Policy",
    "html": "<p>The Disaster and Emergency Policy is the agency's commitment to <strong>continue essential services, protect patients and staff, and communicate clearly<\/strong> whenever normal operations are disrupted.<\/p>\n<div class=\"g-icons\">\n<div><i>\ud83c\udfaf<\/i><h4>Purpose<\/h4><p>Keep high-risk patients safe and cared for during any emergency.<\/p><\/div>\n<div><i>\ud83e\udded<\/i><h4>Who's in charge<\/h4><p>The Administrator or designee activates the plan and leads the agency's response (incident command).<\/p><\/div>\n<div><i>\ud83d\uddfa\ufe0f<\/i><h4>Scope<\/h4><p>Covers all hazards: weather, utility failures, fires, infectious disease, and security threats.<\/p><\/div>\n<div><i>\ud83d\udcc7<\/i><h4>Patient records<\/h4><p>Up-to-date lists of patients, their priority level, TAL, medications, equipment, and emergency contacts.<\/p><\/div>\n<div><i>\ud83e\udd1d<\/i><h4>Partners<\/h4><p>Coordination with NYC Emergency Management, the NYS Department of Health, hospitals, suppliers, and EMS.<\/p><\/div>\n<div><i>\ud83d\udc77<\/i><h4>Staff duty<\/h4><p>All staff are expected to keep their contact details current and to help with the response when able.<\/p><\/div>\n<\/div>\n<div class=\"g-note\"><p>Home care workers provide <strong>essential services<\/strong>. During a declared emergency the agency may contact you outside your normal schedule, so answer calls and texts from the office.<\/p><\/div>"

    "type": "lesson",
    "title": "The Emergency Preparedness Plan",
    "html": "<p>The Emergency Preparedness Plan is built on four core elements required by federal and state regulations for home care agencies.<\/p>\n<div class=\"g-steps\">\n<div><h4>Risk assessment<\/h4><p>Identify the hazards most likely to affect our patients and staff (a hazard vulnerability analysis).<\/p><\/div>\n<div><h4>Policies &amp; procedures<\/h4><p>Step-by-step actions for each hazard, including patient tracking and continuity of care.<\/p><\/div>\n<div><h4>Communication plan<\/h4><p>How we reach staff, patients, families, and agencies, with backup methods if phones fail.<\/p><\/div>\n<div><h4>Training &amp; testing<\/h4><p>In-services like this one, and drills and exercises to test the plan.<\/p><\/div>\n<\/div>\n<h3>Patient priority levels<\/h3>\n<p>Every patient is assigned a <strong>priority level<\/strong> so that, when resources are limited, the most vulnerable patients are reached first.<\/p>\n<figure class=\"g-fig hide-sm\"><svg viewBox=\"0 0 560 120\" role=\"img\" aria-label=\"Patient priority levels\" font-family=\"system-ui,Segoe UI,Arial,sans-serif\">\n<g text-anchor=\"middle\" font-weight=\"800\">\n<path d=\"M10 20h170l20 40-20 40H10z\" fill=\"#a8281f\"/><text x=\"100\" y=\"56\" fill=\"#fff\" font-size=\"17\">LEVEL 1<\/text><text x=\"100\" y=\"78\" fill=\"#fff\" font-size=\"12\" font-weight=\"600\">High priority<\/text>\n<path d=\"M190 20h170l20 40-20 40H190l20-40z\" fill=\"#c9590f\"/><text x=\"285\" y=\"56\" fill=\"#fff\" font-size=\"17\">LEVEL 2<\/text><text x=\"285\" y=\"78\" fill=\"#fff\" font-size=\"12\" font-weight=\"600\">Moderate priority<\/text>\n<path d=\"M370 20h180v80H370l20-40z\" fill=\"#1d7447\"/><text x=\"470\" y=\"56\" fill=\"#fff\" font-size=\"17\">LEVEL 3<\/text><text x=\"470\" y=\"78\" fill=\"#fff\" font-size=\"12\" font-weight=\"600\">Low priority<\/text>\n<\/g><\/svg><\/figure>\n<div class=\"g-table-wrap\"><table class=\"g-table\"><tr><th>Level<\/th><th>Who<\/th><th>What it means<\/th><\/tr>\n<tr><td><strong>1: High<\/strong><\/td><td>Patients who would be at serious risk without care, such as those dependent on ventilators, oxygen, or IV therapy, or who live alone and are bedbound<\/td><td>Services must continue. The agency contacts them first and may arrange transfer to a hospital or shelter.<\/td><\/tr>\n<tr><td><strong>2: Moderate<\/strong><\/td><td>Patients who need care but could manage for about 24\u201348 hours with help from family or neighbors<\/td><td>Services may be postponed briefly. Phone check-ins are made.<\/td><\/tr>\n<tr><td><strong>3: Low<\/strong><\/td><td>Patients who are independent or have reliable support<\/td><td>Services may be postponed until the emergency ends.<\/td><\/tr><\/table><\/div>\n<p>Each patient also has a <strong>personal emergency plan<\/strong> listing where they would go, who would help, their medications, and their equipment needs.<\/p>"
   },
   {
    "type": "lesson",
    "title": "Participation in Drills",
    "html": "<p>Drills show whether the plan works <em>before<\/em> a real emergency happens. Participating is part of your job.<\/p>\n<div class=\"g-icons\">\n<div><i>\ud83d\udcde<\/i><h4>Call-down drill<\/h4><p>The office tests how quickly it can reach every staff member. Respond promptly with your availability.<\/p><\/div>\n<div><i>\ud83d\udde3\ufe0f<\/i><h4>Tabletop exercise<\/h4><p>Staff talk through a scenario (\"a blizzard closes the subway\") and decide what to do.<\/p><\/div>\n<div><i>\ud83c\udfc3<\/i><h4>Functional / full-scale<\/h4><p>Staff actually carry out parts of the plan, sometimes with community partners.<\/p><\/div>\n<div><i>\ud83d\udd25<\/i><h4>Fire &amp; evacuation<\/h4><p>Practice escape routes in the office, and review each patient's home escape plan.<\/p><\/div>\n<\/div>\n<h3>After every drill or real event: evaluation<\/h3>\n<div class=\"g-steps\">\n<div><h4>Debrief<\/h4><p>What happened? What went well?<\/p><\/div>\n<div><h4>Identify gaps<\/h4><p>Wrong phone numbers, missing supplies, unclear roles.<\/p><\/div>\n<div><h4>Improve<\/h4><p>The agency writes an after-action report and updates the plan.<\/p><\/div>\n<div><h4>Re-train<\/h4><p>Changes are shared with staff in the next in-service.<\/p><\/div>\n<\/div>"
   },
   {
    "type": "check",
    "q": "During a call-down drill, what should you do?",
    "options": [
     "Ignore the call because it is only a drill.",
     "Respond promptly and report your availability.",
     "Wait until the next day to call back."
    ],
    "answer": 1
   },
   {
    "type": "lesson",
    "title": "Types of Disaster Impacting Home Care",
    "html": "<div class=\"g-icons\">\n<div><i>\ud83c\udf00<\/i><h4>Hurricanes &amp; coastal storms<\/h4><p>Flooding, evacuation orders, transit shutdowns (for example, Superstorm Sandy in 2012).<\/p><\/div>\n<div><i>\u2744\ufe0f<\/i><h4>Winter storms<\/h4><p>Snow and ice make travel unsafe, cause falls, and can cut power or heat.<\/p><\/div>\n<div><i>\ud83c\udf21\ufe0f<\/i><h4>Extreme heat<\/h4><p>Heat waves are deadly for older adults, people with heart or lung disease, and those on certain medications.<\/p><\/div>\n<div><i>\u26a1<\/i><h4>Power outages<\/h4><p>Threaten oxygen concentrators, ventilators, electric beds, refrigerated medications, and elevators.<\/p><\/div>\n<div><i>\ud83d\udd25<\/i><h4>Fires &amp; explosions<\/h4><p>Building fires, gas leaks, and lithium-ion battery fires.<\/p><\/div>\n<div><i>\ud83e\udda0<\/i><h4>Pandemics &amp; outbreaks<\/h4><p>COVID-19, influenza, and measles can cause staff shortages and require infection control changes.<\/p><\/div>\n<div><i>\ud83c\udf0a<\/i><h4>Flooding<\/h4><p>Flash floods and water main breaks can contaminate water and block streets.<\/p><\/div>\n<div><i>\ud83d\udea8<\/i><h4>Human-caused events<\/h4><p>Terrorism, civil unrest, active threats, and building collapse.<\/p><\/div>\n<div><i>\ud83d\udcbb<\/i><h4>Technology failures<\/h4><p>Phone, internet, or computer outages, or cyberattacks on records or scheduling systems.<\/p><\/div>\n<\/div>\n<h3>Protecting patients in extreme weather<\/h3>\n<div class=\"g-do\">\n<div class=\"do\"><h4>Heat wave<\/h4><ul><li>Keep the patient cool: AC, fans, cool showers, and light clothing.<\/li><li>Offer fluids often, unless the patient is on a fluid restriction.<\/li><li>Know the nearest <strong>cooling center<\/strong> (call 311).<\/li><li>Report confusion, hot dry skin, dizziness, or a fast pulse. <strong>Heat stroke is an emergency: call 911.<\/strong><\/li><\/ul><\/div>\n<div class=\"do\"><h4>Cold / power outage<\/h4><ul><li>Dress the patient in layers and use extra blankets.<\/li><li>Never use a gas oven, stove, or grill to heat the home (carbon monoxide risk).<\/li><li>Switch oxygen users to backup cylinders, and call the supplier.<\/li><li>Keep refrigerated medications cold. Ask the nurse if they are still safe to use.<\/li><\/ul><\/div>\n<\/div>"
   },
   {
    "type": "check",
    "q": "During a heat wave your patient becomes confused, with hot, dry skin. What should you do?",
    "options": [
     "Give them a blanket and let them sleep.",
     "Call 911, because these can be signs of heat stroke, then notify your supervisor.",
     "Wait until your next visit to report it."
    ],
    "answer": 1
   },
   {
    "type": "lesson",
    "title": "Staff Assignment During an Emergency",
    "html": "<p>During an emergency, the agency may change assignments to make sure <strong>Level 1 patients are covered first<\/strong>.<\/p>\n<div class=\"g-steps\">\n<div><h4>Report in<\/h4><p>When an emergency is declared, contact the office (or answer the call-down) and report your availability and whether you can travel safely.<\/p><\/div>\n<div><h4>Accept assignment<\/h4><p>You may be assigned to a different patient, a longer shift, or a shelter or hospital location.<\/p><\/div>\n<div><h4>Check on patients<\/h4><p>Assess their safety, food, water, medications, equipment, and power, and report status to the office.<\/p><\/div>\n<div><h4>Stay until relieved<\/h4><p>Do not leave a Level 1 patient alone without office approval or relief.<\/p><\/div>\n<\/div>\n<div class=\"g-do\">\n<div class=\"do\"><h4>Do<\/h4><ul><li>Keep your phone charged and carry a portable charger.<\/li><li>Plan backup travel routes in case transit stops.<\/li><li>Make your own family plan so you can work with peace of mind.<\/li><\/ul><\/div>\n<div class=\"dont\"><h4>Don't<\/h4><ul><li>Travel into an area under an evacuation order or with downed power lines.<\/li><li>Change patient schedules on your own.<\/li><li>Stop communicating. Silence means the office cannot plan.<\/li><\/ul><\/div>\n<\/div>"
   },
   {
    "type": "lesson",
    "title": "TAL: Transportation Assistance Levels",
    "html": "<p>If a patient must evacuate, emergency managers need to know <strong>what kind of transportation<\/strong> they need. Every patient is assigned a <strong>Transportation Assistance Level (TAL)<\/strong>, which is recorded in their chart and emergency plan.<\/p>\n<figure class=\"g-fig hide-sm\"><svg viewBox=\"0 0 560 210\" role=\"img\" aria-label=\"Transportation Assistance Levels 1 to 3\" font-family=\"system-ui,Segoe UI,Arial,sans-serif\">\n<g text-anchor=\"middle\">\n<rect x=\"10\" y=\"10\" width=\"170\" height=\"190\" rx=\"14\" fill=\"#fbeceb\" stroke=\"#a8281f\" stroke-width=\"3\"/>\n<text x=\"95\" y=\"48\" font-size=\"22\" font-weight=\"800\" fill=\"#a8281f\">TAL 1<\/text><text x=\"95\" y=\"100\" font-size=\"40\">\ud83d\ude91<\/text>\n<text x=\"95\" y=\"140\" font-size=\"13\" font-weight=\"700\" fill=\"#15232d\">Non-ambulatory<\/text><text x=\"95\" y=\"160\" font-size=\"12\" fill=\"#5a6a76\">needs stretcher /<\/text><text x=\"95\" y=\"176\" font-size=\"12\" fill=\"#5a6a76\">ambulance<\/text>\n<rect x=\"195\" y=\"10\" width=\"170\" height=\"190\" rx=\"14\" fill=\"#fdf3dc\" stroke=\"#8a5a00\" stroke-width=\"3\"/>\n<text x=\"280\" y=\"48\" font-size=\"22\" font-weight=\"800\" fill=\"#8a5a00\">TAL 2<\/text><text x=\"280\" y=\"100\" font-size=\"40\">\u267f<\/text>\n<text x=\"280\" y=\"140\" font-size=\"13\" font-weight=\"700\" fill=\"#15232d\">Wheelchair<\/text><text x=\"280\" y=\"160\" font-size=\"12\" fill=\"#5a6a76\">needs lift-equipped<\/text><text x=\"280\" y=\"176\" font-size=\"12\" fill=\"#5a6a76\">vehicle (ambulette)<\/text>\n<rect x=\"380\" y=\"10\" width=\"170\" height=\"190\" rx=\"14\" fill=\"#e5f3eb\" stroke=\"#1d7447\" stroke-width=\"3\"/>\n<text x=\"465\" y=\"48\" font-size=\"22\" font-weight=\"800\" fill=\"#1d7447\">TAL 3<\/text><text x=\"465\" y=\"100\" font-size=\"40\">\ud83d\udeb6<\/text>\n<text x=\"465\" y=\"140\" font-size=\"13\" font-weight=\"700\" fill=\"#15232d\">Ambulatory<\/text><text x=\"465\" y=\"160\" font-size=\"12\" fill=\"#5a6a76\">can walk; car, van<\/text><text x=\"465\" y=\"176\" font-size=\"12\" fill=\"#5a6a76\">or bus with help<\/text>\n<\/g><\/svg><\/figure>\n<div class=\"g-table-wrap\"><table class=\"g-table\"><tr><th>TAL<\/th><th>Patient<\/th><th>Transportation needed<\/th><\/tr>\n<tr><td><strong>TAL 1<\/strong><\/td><td>Non-ambulatory, bedbound, or dependent on life-sustaining equipment<\/td><td>Ambulance or stretcher vehicle<\/td><\/tr>\n<tr><td><strong>TAL 2<\/strong><\/td><td>Uses a wheelchair or cannot walk long distances<\/td><td>Wheelchair-accessible (lift) vehicle or ambulette<\/td><\/tr>\n<tr><td><strong>TAL 3<\/strong><\/td><td>Can walk, with or without a cane or walker<\/td><td>Car, van, or bus, possibly with an escort<\/td><\/tr><\/table><\/div>\n<div class=\"g-warn\"><p>If you notice a change in how your patient moves (for example, they can no longer walk, or now need a wheelchair), <strong>tell your RN supervisor<\/strong> so their TAL can be updated. A wrong TAL can mean the wrong vehicle arrives in an evacuation.<\/p><\/div>"
   },
   {
    "type": "check",
    "q": "A patient who uses a wheelchair and needs a lift-equipped vehicle to evacuate is which TAL?",
    "options": [
     "TAL 1",
     "TAL 2",
     "TAL 3"
    ],
    "answer": 1
   },
   {
    "type": "lesson",
    "title": "Communication with Authorized Family Members Regarding Pandemic Infection",
    "html": "<p>During a pandemic or outbreak, families are worried and want information. Communication must be <strong>timely, accurate, and private<\/strong>.<\/p>\n<div class=\"g-steps\">\n<div><h4>Who may receive information<\/h4><p>Only the patient, the health care agent or proxy, and the <strong>authorized family members or representatives<\/strong> listed in the patient's record.<\/p><\/div>\n<div><h4>Who communicates<\/h4><p>The RN supervisor or designated office staff inform authorized family members of infections, exposures, and changes in services, following agency policy.<\/p><\/div>\n<div><h4>What is shared<\/h4><p>The patient's condition, infection or exposure status, changes to the care plan or schedule, and precautions the family should take.<\/p><\/div>\n<div><h4>How<\/h4><p>By phone, secure message, or letter. Calls are documented in the record.<\/p><\/div>\n<\/div>\n<div class=\"g-do\">\n<div class=\"do\"><h4>As a caregiver, do<\/h4><ul><li>Verify who you are speaking with.<\/li><li>Refer questions about diagnosis or test results to the nurse.<\/li><li>Share general prevention tips: handwashing, masks, and ventilation.<\/li><li>Tell the office if a family member reports symptoms or exposure.<\/li><\/ul><\/div>\n<div class=\"dont\"><h4>Don't<\/h4><ul><li>Tell neighbors, other patients, or unlisted relatives about anyone's infection.<\/li><li>Share another patient's or coworker's illness.<\/li><li>Guess or spread rumors about the outbreak.<\/li><\/ul><\/div>\n<\/div>"
   },
   {
    "type": "check",
    "q": "A caller says she is the patient's niece and asks if the patient has COVID-19. She is not listed as authorized. What should you do?",
    "options": [
     "Tell her, because she is family.",
     "Politely decline, and refer her to the office. Information goes only to authorized family members.",
     "Hang up without saying anything."
    ],
    "answer": 1
   },
   {
    "type": "lesson",
    "title": "Educational Tool: Home Care Emergency Action",
    "html": "<p>Use this action guide with your patients. A copy should be kept in every patient's home.<\/p>\n<div class=\"g-steps one\">\n<div><h4>Stay informed<\/h4><p>Sign up for <strong>Notify NYC<\/strong> alerts. Follow official news, and call <strong>311<\/strong> for city services. Call <strong>911<\/strong> only for emergencies.<\/p><\/div>\n<div><h4>Know your zone<\/h4><p>Find out the home's hurricane evacuation zone (\"Know Your Zone\") and the nearest evacuation center.<\/p><\/div>\n<div><h4>Shelter in place or evacuate<\/h4><p>Follow official orders. If sheltering in place, stay indoors with supplies. If evacuating, bring the go-bag, medications, and equipment.<\/p><\/div>\n<div><h4>Protect life-sustaining equipment<\/h4><p>Patients using electric medical equipment should register with their utility's life-support equipment program, and keep backup batteries and oxygen cylinders.<\/p><\/div>\n<div><h4>Contact the agency<\/h4><p>Patients and families should call the agency to report their location, condition, and needs.<\/p><\/div>\n<div><h4>After the emergency<\/h4><p>Check for hazards (gas smell, water damage, spoiled food or medicines) and report problems.<\/p><\/div>\n<\/div>\n<div class=\"g-warn\"><p>If you smell gas: leave immediately, do not turn lights or switches on or off, and call 911 and the utility company from outside.<\/p><\/div>"
   },
   {
    "type": "lesson",
    "title": "Educational Tool: Emergency Preparedness Checklist",
    "html": "<p>Help patients prepare a <strong>Go-Bag<\/strong> (to take if they must leave) and <strong>emergency supplies<\/strong> (to shelter at home for at least 3 days).<\/p>\n<div class=\"g-do\">\n<div class=\"do\"><h4>Go-Bag<\/h4><ul><li>A 7-day supply of medications, plus a written medication list<\/li><li>Copies of ID, insurance cards, health care proxy, MOLST or DNR<\/li><li>Emergency contact list and the agency phone number<\/li><li>Glasses, hearing aids, dentures, and batteries<\/li><li>Phone charger and power bank<\/li><li>Flashlight, small radio, and extra batteries<\/li><li>Some cash, water, snacks, and a change of clothes<\/li><\/ul><\/div>\n<div class=\"do\"><h4>Shelter-at-home supplies<\/h4><ul><li>Water: <strong>1 gallon per person per day<\/strong>, for at least 3 days<\/li><li>Non-perishable food and a manual can opener<\/li><li>First-aid kit, gloves, masks, and hand sanitizer<\/li><li>Incontinence and personal care supplies<\/li><li>Backup oxygen cylinders and medical equipment batteries<\/li><li>Blankets, and food and supplies for pets<\/li><li>Whistle to signal for help<\/li><\/ul><\/div>\n<\/div>\n<ul class=\"g-check\"><li>Review the checklist with the patient and family at least once a year and before storm season.<\/li><li>Replace expired medications, food, water, and batteries.<\/li><li>Report missing supplies to your RN supervisor.<\/li><\/ul>"
   },
   {
    "type": "lesson",
    "title": "Educational Tool: Your Family Disaster Plan",
    "html": "<p>You can only help patients if your own family is safe. Make a plan with your household.<\/p>\n<div class=\"g-icons\">\n<div><i>\ud83d\udccd<\/i><h4>Meeting places<\/h4><p>One near your home, and one outside your neighborhood.<\/p><\/div>\n<div><i>\u260e\ufe0f<\/i><h4>Out-of-state contact<\/h4><p>One person everyone checks in with. Long-distance calls and texts often work when local lines are busy.<\/p><\/div>\n<div><i>\ud83e\uddd2<\/i><h4>Children &amp; dependents<\/h4><p>Who picks up the children? Who checks on elderly relatives?<\/p><\/div>\n<div><i>\ud83d\udc3e<\/i><h4>Pets<\/h4><p>Carrier, food, records, and pet-friendly shelter options.<\/p><\/div>\n<div><i>\ud83c\udf92<\/i><h4>Your own Go-Bag<\/h4><p>The same checklist as for patients, plus work ID, uniform, and PPE.<\/p><\/div>\n<div><i>\ud83d\uddd2\ufe0f<\/i><h4>Write it down<\/h4><p>Keep a printed copy, and save it on your phone.<\/p><\/div>\n<\/div>\n<div class=\"g-scenario\"><h4>What would you do?<\/h4><p>A hurricane warning is issued for tomorrow. Your patient is on oxygen and lives alone in Zone 1. Your children's school will be closed.<\/p>\n<details><summary>See the answer<\/summary><p>Activate your family plan for childcare. Call the office and report your availability. Make sure the patient's go-bag and backup oxygen are ready, and that the office knows the patient's TAL and priority level. Follow evacuation orders and your assignment from the office.<\/p><\/details><\/div>"
   },
   {
    "type": "lesson",
    "title": "Shelter in Place vs. Evacuation",
    "html": "<div class=\"g-do\">\n<div class=\"do\"><h4>Shelter in place when...<\/h4><ul><li>Officials tell people to stay indoors (for example, a chemical release, severe storm, or extreme cold).<\/li><li>Traveling would be more dangerous than staying.<\/li><li>The home is safe, with heat or cooling, water, and supplies.<\/li><\/ul><p><strong>Do:<\/strong> go to an interior room, close windows and doors, keep a radio or phone on, and use the emergency supplies.<\/p><\/div>\n<div class=\"dont\"><h4>Evacuate when...<\/h4><ul><li>An evacuation order is issued for the patient's zone.<\/li><li>The home is damaged, flooded, on fire, or has a gas leak.<\/li><li>Life-sustaining equipment cannot be powered and there is no backup.<\/li><\/ul><p><strong>Do:<\/strong> take the go-bag, medications, equipment, and documents. Follow the TAL plan, and tell the office where the patient is going.<\/p><\/div>\n<\/div>\n<div class=\"g-steps\">\n<div><h4>72 hours before a storm<\/h4><p>Review patient plans, refill medications, check supplies and backup oxygen, and charge devices.<\/p><\/div>\n<div><h4>24 hours before<\/h4><p>Confirm transportation for TAL 1 and 2 patients in evacuation zones. Confirm staff availability.<\/p><\/div>\n<div><h4>During<\/h4><p>Shelter or evacuate per orders. Make status calls to patients and the office.<\/p><\/div>\n<div><h4>After<\/h4><p>Check on every patient, resume services by priority level, and report damage and needs.<\/p><\/div>\n<\/div>"
   },
   {
    "type": "check",
    "q": "An evacuation order is issued for your patient's zone. What is the correct action?",
    "options": [
     "Stay in the home because it feels safer.",
     "Help the patient evacuate with their go-bag and equipment, following the TAL plan, and tell the office where they are going.",
     "Leave the patient and go home."
    ],
    "answer": 1
   },
   {
    "type": "lesson",
    "title": "Power Outages & Life-Sustaining Equipment",
    "html": "<div class=\"g-icons\">\n<div><i>\ud83e\udec1<\/i><h4>Oxygen<\/h4><p>Switch to backup cylinders, turn the concentrator off, and call the supplier for more tanks.<\/p><\/div>\n<div><i>\ud83d\udd0b<\/i><h4>Ventilators &amp; suction<\/h4><p>Use the battery backup. Know how long it lasts. A Level 1 patient may need transfer to a hospital.<\/p><\/div>\n<div><i>\ud83d\udecf\ufe0f<\/i><h4>Electric beds &amp; air mattresses<\/h4><p>Reposition the patient more often to prevent pressure sores.<\/p><\/div>\n<div><i>\ud83e\uddca<\/i><h4>Refrigerated medications<\/h4><p>Keep the fridge closed. Insulin can be kept in a cooler. Ask the nurse about safety.<\/p><\/div>\n<div><i>\ud83d\uded7<\/i><h4>Elevators<\/h4><p>High-rise patients may be trapped. Report them to the office for a welfare check.<\/p><\/div>\n<div><i>\ud83d\udd6f\ufe0f<\/i><h4>Lighting<\/h4><p>Use flashlights, never candles, especially near oxygen.<\/p><\/div>\n<\/div>\n<div class=\"g-warn\"><p>Never run a generator indoors or on a balcony. Carbon monoxide can kill within minutes. CO alarms must have working batteries.<\/p><\/div>"
   },
   {
    "type": "lesson",
    "title": "Pandemic Operations",
    "html": "<p>COVID-19 showed that pandemics are long emergencies that change how we work for months.<\/p>\n<ul class=\"g-check\"><li><strong>Screening:<\/strong> staff self-screen before every shift, and patients are screened before visits.<\/li><li><strong>PPE:<\/strong> use the PPE assigned for each patient's status. Follow agency instructions for extended use or reuse during shortages.<\/li><li><strong>Cohorting:<\/strong> the agency may assign the same aides to infected patients to limit spread.<\/li><li><strong>Staffing:<\/strong> expect schedule changes. Report illness early so coverage can be arranged.<\/li><li><strong>Telehealth:<\/strong> some nursing visits may happen by phone or video.<\/li><li><strong>Family communication:<\/strong> authorized family members are updated by the agency on infections and changes in service.<\/li><li><strong>Your health:<\/strong> vaccination, rest, and mental-health support help you stay well enough to work.<\/li><\/ul>"
   },
   {
    "type": "check",
    "q": "During a pandemic, you wake up with a fever before your shift. You should:",
    "options": [
     "Call the office right away so coverage can be arranged, and follow testing guidance.",
     "Go to work and hope it passes.",
     "Ask your patient's family to cover for you."
    ],
    "answer": 0
   },
   {
    "type": "lesson",
    "title": "Case Study: A 3-Day Coastal Storm",
    "html": "<div class=\"g-scenario\"><h4>Day 1: Warning<\/h4><p>A coastal storm is forecast. You care for Mr. Allen (TAL 1, ventilator, Zone 1) and Mrs. Chen (TAL 3, independent, Zone 4).<\/p>\n<details><summary>What should happen?<\/summary><p>Mr. Allen is Level 1. The office confirms his evacuation transportation (an ambulance) and backup power. Mrs. Chen is likely Level 3, and her visit may be postponed with a phone check-in. You confirm your availability and family plan.<\/p><\/details><\/div>\n<div class=\"g-scenario\"><h4>Day 2: The storm<\/h4><p>Subways are shut down. The office asks if you can stay overnight with another Level 1 patient near your home.<\/p>\n<details><summary>What should you do?<\/summary><p>If it is safe and your family plan allows, accept the assignment. Bring your go-bag, keep your phone charged, and report the patient's status to the office regularly.<\/p><\/details><\/div>\n<div class=\"g-scenario\"><h4>Day 3: Recovery<\/h4><p>Power is out in Mrs. Chen's building, and her refrigerator is warm.<\/p>\n<details><summary>What should you do?<\/summary><p>Report it to the office. The nurse will advise on medications and food safety, and the agency may arrange supplies or relocation. Services resume by priority level.<\/p><\/details><\/div>"
   },
   {
    "type": "lesson",
    "title": "Summary: Disaster & Emergency Preparedness",
    "html": "<ol>\n<li>The Disaster and Emergency Policy keeps essential care going. The Administrator activates the plan.<\/li>\n<li>The plan has four elements: risk assessment, policies, communication, and training and testing.<\/li>\n<li>Priority levels 1\u20133 decide which patients are reached first.<\/li>\n<li>Take part in drills and give feedback. The plan improves after every evaluation.<\/li>\n<li>Know the disasters that affect home care: storms, heat, outages, fires, pandemics, and more.<\/li>\n<li>In an emergency, report your availability and follow your assignment. Never abandon a Level 1 patient.<\/li>\n<li>TAL 1 means ambulance, TAL 2 means wheelchair vehicle, TAL 3 means ambulatory. Report changes in mobility.<\/li>\n<li>Share pandemic infection information only with authorized family members, through the proper channels.<\/li>\n<li>Use the Emergency Action guide, the Preparedness Checklist, and your Family Disaster Plan.<\/li>\n<\/ol>"
   }

 {
  "id": "oxygen",
  "title": "Oxygen Safety",
  "summary": "General safety measures, equipment use, cleaning and maintenance, travel precautions, monitoring the patient, and notification and documentation.",
  "color": "#1b7fa6",
  "icon": "tank",
  "minutes": 60,
  "endpoint": "",
  "driveFolder": "Oxygen Safety",
  "intro": "<p>Many of our patients (also called participants) use oxygen at home. Oxygen is a <strong>prescribed medication<\/strong>, and like any medication it must be used exactly as ordered. This in-service reviews the agency's revised <strong>Oxygen Safety Policy<\/strong>.<\/p>\n<div class=\"g-icons\">\n<div><i>\ud83d\udee1\ufe0f<\/i><h4>1. General Safety Measures<\/h4><p>Fire prevention, signage, and safe surroundings.<\/p><\/div>\n<div><i>\ud83e\udec1<\/i><h4>2. Equipment Use<\/h4><p>Concentrators, cylinders, liquid oxygen, cannulas, and masks.<\/p><\/div>\n<div><i>\ud83e\uddfd<\/i><h4>3. Cleaning &amp; Maintenance<\/h4><p>Keeping equipment clean and working.<\/p><\/div>\n<div><i>\ud83d\ude97<\/i><h4>4. Travel Precautions<\/h4><p>Cars, appointments, and air travel.<\/p><\/div>\n<div><i>\ud83d\udc40<\/i><h4>5. Monitoring Condition<\/h4><p>Signs of too little or too much oxygen.<\/p><\/div>\n<div><i>\ud83d\udcdd<\/i><h4>6. Notification &amp; Documentation<\/h4><p>Who to call and what to record.<\/p><\/div>\n<\/div>",
  "steps": [
   {
    "type": "lesson",
    "title": "Why Oxygen Safety Matters",
    "html": "<p>The air we breathe is about 21% oxygen. Medical oxygen raises the oxygen level around the patient, in their clothing, bedding, hair, and furniture. <strong>Oxygen itself does not burn, but it makes fire start more easily and burn hotter and faster.<\/strong><\/p>\n<figure class=\"g-fig fit\"><svg viewBox=\"0 0 560 330\" role=\"img\" aria-label=\"Fire triangle: heat, fuel, oxygen\" font-family=\"system-ui,Segoe UI,Arial,sans-serif\">\n<polygon points=\"280,20 520,300 40,300\" fill=\"#fdf3dc\" stroke=\"#c9590f\" stroke-width=\"8\" stroke-linejoin=\"round\"/>\n<text x=\"280\" y=\"190\" text-anchor=\"middle\" font-size=\"46\">\ud83d\udd25<\/text>\n<text x=\"280\" y=\"232\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#8a3b00\">Remove any side and the fire goes out<\/text>\n<g font-size=\"20\" font-weight=\"800\">\n<text x=\"120\" y=\"150\" text-anchor=\"middle\" fill=\"#b23a2e\" transform=\"rotate(-49 120 150)\">HEAT<\/text>\n<text x=\"440\" y=\"150\" text-anchor=\"middle\" fill=\"#1b7fa6\" transform=\"rotate(49 440 150)\">OXYGEN<\/text>\n<text x=\"280\" y=\"290\" text-anchor=\"middle\" fill=\"#8a6100\">FUEL<\/text><\/g>\n<\/svg><\/figure>\n<div class=\"g-table-wrap\"><table class=\"g-table\"><tr><th>Equipment<\/th><th>How it works<\/th><th>Key safety points<\/th><\/tr>\n<tr><td>\ud83d\udd0c Oxygen concentrator<\/td><td>An electric machine that pulls oxygen from room air<\/td><td>Needs power. Keep 6\u201312 inches from walls and curtains for air flow. Keep a backup cylinder for power outages.<\/td><\/tr>\n<tr><td>\ud83e\uddef Compressed gas cylinder<\/td><td>Oxygen stored under high pressure in a metal tank<\/td><td>Always secured upright, in a cart or stand. A falling tank can break the valve and become a projectile.<\/td><\/tr>\n<tr><td>\u2744\ufe0f Liquid oxygen<\/td><td>Very cold liquid oxygen in an insulated reservoir<\/td><td>Can cause <strong>frostbite<\/strong>. Never touch frosted parts. Keep upright and ventilated.<\/td><\/tr>\n<tr><td>\ud83c\udf92 Portable concentrator<\/td><td>A small battery-powered unit for outings<\/td><td>Charge batteries fully. Carry spares as prescribed.<\/td><\/tr><\/table><\/div>"
   },
   {
    "type": "lesson",
    "title": "1. General Safety Measures",
    "html": "<figure class=\"g-fig\"><svg viewBox=\"0 0 560 360\" role=\"img\" aria-label=\"Keep flames 10 feet and heat sources 5 feet away from oxygen\" font-family=\"system-ui,Segoe UI,Arial,sans-serif\">\n<circle cx=\"280\" cy=\"180\" r=\"165\" fill=\"#fbeceb\" stroke=\"#a8281f\" stroke-width=\"3\" stroke-dasharray=\"10 8\"/>\n<circle cx=\"280\" cy=\"180\" r=\"95\" fill=\"#fdf3dc\" stroke=\"#8a5a00\" stroke-width=\"3\" stroke-dasharray=\"8 6\"/>\n<circle cx=\"280\" cy=\"180\" r=\"42\" fill=\"#e3f2f8\" stroke=\"#1b7fa6\" stroke-width=\"4\"/>\n<text x=\"280\" y=\"176\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#1b7fa6\">O\u2082<\/text>\n<text x=\"280\" y=\"196\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#1b7fa6\">in use<\/text>\n<rect x=\"150\" y=\"96\" width=\"260\" height=\"38\" rx=\"8\" fill=\"#fff\" stroke=\"#8a5a00\" stroke-width=\"1.5\"/>\n<text x=\"280\" y=\"112\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" fill=\"#8a5a00\">5 FT: no heat sources<\/text>\n<text x=\"280\" y=\"128\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a5a00\">heaters, radiators, stoves, hair dryers<\/text>\n<rect x=\"100\" y=\"18\" width=\"360\" height=\"42\" rx=\"8\" fill=\"#fff\" stroke=\"#a8281f\" stroke-width=\"1.5\"/>\n<text x=\"280\" y=\"36\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#a8281f\">10 FT: no open flames or smoking<\/text>\n<text x=\"280\" y=\"54\" text-anchor=\"middle\" font-size=\"12\" fill=\"#a8281f\">cigarettes, e-cigarettes, candles, matches, gas burners<\/text>\n<text x=\"70\" y=\"300\" font-size=\"30\">\ud83d\udead<\/text><text x=\"460\" y=\"300\" font-size=\"30\">\ud83d\udd6f\ufe0f<\/text>\n<\/svg><figcaption>Keep open flames at least 10 feet and heat sources at least 5 feet from oxygen equipment and tubing.<\/figcaption><\/figure>\n<div class=\"g-do\">\n<div class=\"do\"><h4>Always<\/h4><ul><li>Post <strong>\"Oxygen in Use, No Smoking\"<\/strong> signs on the entry door and in the patient's room.<\/li><li>Keep working smoke detectors and a fire extinguisher in the home.<\/li><li>Use <strong>water-based<\/strong> lubricants and lip balms (for example, K-Y Jelly) for dry lips and nose.<\/li><li>Keep the room well ventilated. Do not store oxygen in closets, car trunks, or under beds.<\/li><li>Plug concentrators directly into a grounded wall outlet.<\/li><li>Turn oxygen off when it is not in use.<\/li><\/ul><\/div>\n<div class=\"dont\"><h4>Never<\/h4><ul><li>Smoke, vape, or allow anyone to smoke in the home. Never leave oxygen tubing near a lit cigarette.<\/li><li>Use candles, matches, lighters, gas stoves, fireplaces, or space heaters near the oxygen.<\/li><li>Use petroleum products (Vaseline), oil-based lotions, aerosol sprays, or alcohol near the face.<\/li><li>Use extension cords or power strips with a concentrator.<\/li><li>Cover the equipment with blankets or clothing.<\/li><li>Use electric razors, hair dryers, or toys that spark while oxygen is on.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"g-warn\"><p>If the patient or a visitor insists on smoking: ask them to stop, turn off the oxygen if it is safe, move away from the area, and <strong>report it to your supervisor immediately<\/strong>. Smoking while on oxygen is a leading cause of fatal home oxygen fires and facial burns.<\/p><\/div>"
   },
   {

    "q": "What should be used for a patient's dry lips while they are on oxygen?",

    "answer": 1

   {
    "type": "lesson",
    "title": "2. Equipment Use",
    "html": "<div class=\"g-icons\">\n<div><i>\ud83d\udc43<\/i><h4>Nasal cannula<\/h4><p>Prongs curve <strong>down into the nostrils<\/strong>. Loop the tubing over the ears and slide the adjuster under the chin, snug but not tight.<\/p><\/div>\n<div><i>\ud83d\ude37<\/i><h4>Face mask<\/h4><p>Covers the nose and mouth. Fit it snugly over the nose bridge. Check the skin under the strap.<\/p><\/div>\n<div><i>\ud83c\udf9a\ufe0f<\/i><h4>Flow rate<\/h4><p>Liters per minute (LPM) <strong>as prescribed<\/strong>. Check it at every visit against the plan of care.<\/p><\/div>\n<div><i>\ud83d\udca7<\/i><h4>Humidifier bottle<\/h4><p>If ordered, fill it with <strong>distilled water<\/strong> to the fill line. Bubbling shows the oxygen is flowing.<\/p><\/div>\n<div><i>\ud83e\uddf5<\/i><h4>Tubing<\/h4><p>No kinks. Keep it away from doors and wheels. Use the shortest safe length to reduce tripping.<\/p><\/div>\n<div><i>\ud83e\udded<\/i><h4>Cylinder gauge<\/h4><p>Check how full the tank is. Tell the family or supplier early when the level is low.<\/p><\/div>\n<\/div>\n<h3>Checking that oxygen is flowing<\/h3>\n<div class=\"g-steps\">\n<div><h4>Check the setting<\/h4><p>Confirm the flow rate matches the order.<\/p><\/div>\n<div><h4>Check the source<\/h4><p>The concentrator is on with no alarm, or the cylinder valve is open and the gauge shows oxygen.<\/p><\/div>\n<div><h4>Check the tubing<\/h4><p>Connected at both ends, with no kinks or cracks.<\/p><\/div>\n<div><h4>Check the patient<\/h4><p>Feel the flow at the prongs, or see bubbles in the humidifier. Watch the patient's breathing and color.<\/p><\/div>\n<\/div>\n<div class=\"g-warn\"><p><strong>Never change the flow rate<\/strong>, even if the patient or family asks. Only the prescriber can change oxygen orders. If the patient seems short of breath, call your RN supervisor, or 911 in an emergency.<\/p><\/div>"
   },
   {
    "type": "lesson",
    "title": "Handling & Storing Cylinders",
    "html": "<ul class=\"g-check\"><li>Store cylinders <strong>upright<\/strong>, secured in a stand or cart, or lying flat if your supplier instructs.<\/li><li>Store them in a well-ventilated area, away from heat, sunlight, and flammable materials (paint, gasoline, cleaning sprays).<\/li><li>Keep full and empty tanks separate and clearly marked.<\/li><li>Open the valve slowly. Never use tools or force on valves.<\/li><li>Never drop, drag, roll, or bang cylinders. Use a cart.<\/li><li>Do not let children play with or near the equipment.<\/li><li>For liquid oxygen, wear gloves when filling and keep it upright. Never touch frosted parts.<\/li><\/ul>"
   },
   {
    "type": "check",
    "q": "A patient's daughter asks you to \"turn up the oxygen a little\" because her mother looks tired. What should you do?",
    "options": [
     "Increase it by 1 liter.",
     "Do not change the flow rate. Check the patient and report to your RN supervisor.",
     "Turn it off so she can rest."
    ],
    "answer": 1
   },
   {
    "type": "lesson",
    "title": "3. Equipment Cleaning & Maintenance",
    "html": "<p>Clean equipment prevents infections and keeps machines working. Follow the supplier's instructions and the plan of care. Typical schedules are below.<\/p>\n<div class=\"g-table-wrap\"><table class=\"g-table\"><tr><th>Item<\/th><th>How often<\/th><th>How<\/th><\/tr>\n<tr><td>Nasal cannula or mask<\/td><td>Wipe daily. Replace about every 2 weeks, or sooner if dirty, stiff, or after illness.<\/td><td>Wipe with a damp cloth or mild soap and water. Rinse and air dry.<\/td><\/tr>\n<tr><td>Tubing<\/td><td>Replace per supplier (often monthly)<\/td><td>Check for cracks, kinks, and moisture.<\/td><\/tr>\n<tr><td>Humidifier bottle<\/td><td>Empty and refill daily. Clean weekly.<\/td><td>Use distilled water only. Wash with soap and water and rinse well. Disinfect as instructed.<\/td><\/tr>\n<tr><td>Concentrator filter<\/td><td>Weekly<\/td><td>Remove, wash with mild soap and water, dry completely, and replace.<\/td><\/tr>\n<tr><td>Concentrator cabinet<\/td><td>Weekly<\/td><td>Unplug, then wipe with a damp cloth. Never spray liquid into the machine.<\/td><\/tr><\/table><\/div>\n<div class=\"g-do\">\n<div class=\"do\"><h4>Do<\/h4><ul><li>Wash your hands before handling equipment.<\/li><li>Keep the supplier's 24-hour phone number posted near the equipment.<\/li><li>Report alarms, strange noises, burning smells, or damage right away.<\/li><\/ul><\/div>\n<div class=\"dont\"><h4>Don't<\/h4><ul><li>Use oil, grease, or alcohol-based cleaners on equipment.<\/li><li>Try to repair equipment yourself.<\/li><li>Reuse a cannula from another person.<\/li><\/ul><\/div>\n<\/div>"
   },
   {
    "type": "check",
    "q": "What type of water should be used in an oxygen humidifier bottle?",
    "options": [
     "Tap water",
     "Distilled water",
     "Salt water"
    ],
    "answer": 1
   },
   {
    "type": "lesson",
    "title": "4. Travel Precautions",
    "html": "<div class=\"g-icons\">\n<div><i>\ud83d\ude97<\/i><h4>In the car<\/h4><p>Secure the cylinder upright, or wedged so it cannot roll, on the floor or with a seatbelt. Keep a window slightly open. No smoking in the car.<\/p><\/div>\n<div><i>\ud83c\udf21\ufe0f<\/i><h4>Heat<\/h4><p>Never leave oxygen in a parked car or trunk. Heat raises tank pressure.<\/p><\/div>\n<div><i>\u23f1\ufe0f<\/i><h4>Bring enough<\/h4><p>Bring enough oxygen for the whole trip plus extra time for delays. Check gauges and batteries before leaving.<\/p><\/div>\n<div><i>\ud83d\ude8c<\/i><h4>Public transit &amp; ambulettes<\/h4><p>Use a carrying bag or cart. Keep the tubing away from doors and wheels.<\/p><\/div>\n<div><i>\u2708\ufe0f<\/i><h4>Air travel<\/h4><p>Airlines allow only FAA-approved portable concentrators, and require advance notice and often a doctor's form. Planning is done with the nurse and supplier.<\/p><\/div>\n<div><i>\ud83c\udfe5<\/i><h4>Appointments<\/h4><p>Bring the oxygen prescription or supplier information, and the emergency contact list.<\/p><\/div>\n<\/div>"
   },
   {
    "type": "check",
    "q": "Why should oxygen never be left in a parked car on a hot day?",
    "options": [
     "It will freeze.",
     "Heat raises the pressure in the tank and increases the risk of leaks or fire.",
     "It will lose its color."
    ],
    "answer": 1
   },
   {
    "type": "lesson",
    "title": "5. Monitoring the Patient's Condition",
    "html": "<p>You see the patient more than anyone else on the care team. Your observations can prevent emergencies.<\/p>\n<div class=\"g-do\">\n<div class=\"dont\"><h4>Possible low oxygen: report right away<\/h4><ul><li>Shortness of breath, or breathing faster or harder<\/li><li>Bluish or gray lips, nail beds, or skin (cyanosis)<\/li><li>Restlessness, anxiety, confusion, or new dizziness<\/li><li>Fast heartbeat, sweating<\/li><li>Pulse oximeter reading below the level in the plan of care<\/li><\/ul><\/div>\n<div class=\"dont\"><h4>Possible too much oxygen (especially COPD): report right away<\/h4><ul><li>Unusual drowsiness or hard to wake<\/li><li>Headache, confusion, or slurred speech<\/li><li>Slow, shallow breathing<\/li><li>Flushed skin<\/li><\/ul><\/div>\n<\/div>\n<h3>Comfort and skin<\/h3>\n<ul class=\"g-check\"><li>Check behind the ears, the cheeks, and the nostrils for redness or sores from the tubing. Pad the tubing if allowed.<\/li><li>Report nosebleeds, a very dry nose, or sore throat.<\/li><li>Encourage fluids as allowed, and mouth care for dry mouth.<\/li><li>Use a pulse oximeter only if it is part of the plan of care. Warm the finger and remove dark nail polish for an accurate reading. Report the result. Do not adjust oxygen.<\/li><\/ul>\n<div class=\"g-warn\"><p><strong>Emergency:<\/strong> severe trouble breathing, chest pain, blue lips, or the patient is unresponsive. <strong>Call 911<\/strong>, then notify your RN supervisor.<\/p><\/div>"
   },
   {
    "type": "check",
    "q": "Which sign may mean the patient is not getting enough oxygen?",
    "options": [
     "Pink, warm skin",
     "Bluish lips and new confusion",
     "Calm, slow breathing"
    ],
    "answer": 1
   },
   {
    "type": "lesson",
    "title": "6. Notification & Documentation",
    "html": "<div class=\"g-table-wrap\"><table class=\"g-table\"><tr><th>Situation<\/th><th>Notify<\/th><\/tr>\n<tr><td>Breathing emergency, fire, or unresponsive patient<\/td><td><strong>911 first<\/strong>, then your RN supervisor and the office<\/td><\/tr>\n<tr><td>Change in condition (breathing, color, confusion, skin breakdown)<\/td><td>RN supervisor, the same visit<\/td><\/tr>\n<tr><td>Equipment alarm, malfunction, low supply, or power outage<\/td><td>Oxygen supplier (24-hour number) and the office<\/td><\/tr>\n<tr><td>Smoking, open flames, or unsafe storage in the home<\/td><td>RN supervisor or the office, immediately<\/td><\/tr>\n<tr><td>Patient refuses to wear oxygen<\/td><td>RN supervisor<\/td><\/tr><\/table><\/div>\n<h3>What to document<\/h3>\n<ul class=\"g-check\"><li>The oxygen device and the flow rate observed (for example, \"nasal cannula at 2 LPM via concentrator\").<\/li><li>Your observations of breathing, color, behavior, and skin under the tubing.<\/li><li>Any refusals, safety concerns, or equipment problems.<\/li><li>Who you notified, when, and what you were told to do.<\/li><li>Write facts only, in ink or in the agency app, with the date and time.<\/li><\/ul>"
   },
   {
    "type": "lesson",
    "title": "Fire Emergency with Oxygen in Use",
    "html": "<div class=\"g-steps\">\n<div><h4>Turn off the oxygen<\/h4><p>If it is safe, close the cylinder valve or switch off the concentrator, and remove the cannula from the patient.<\/p><\/div>\n<div><h4>Rescue<\/h4><p>Move the patient away from the fire.<\/p><\/div>\n<div><h4>Alarm<\/h4><p>Call 911 from a safe place.<\/p><\/div>\n<div><h4>Contain &amp; evacuate<\/h4><p>Close doors behind you, leave the building, and do not go back in.<\/p><\/div>\n<\/div>\n<div class=\"g-note\"><p>If the patient's face or clothing catches fire, remove the oxygen, then <strong>Stop, Drop, and Roll<\/strong>, or smother the flames with a blanket. Cool burns with cool water and call 911.<\/p><\/div>"
   },
   {
    "type": "lesson",
    "title": "Using a Portable Concentrator & Liquid Oxygen",
    "html": "<div class=\"g-icons two\">\n<div><i>\ud83c\udf92<\/i><h4>Portable oxygen concentrator (POC)<\/h4><p>Check that the battery is charged before outings. Many POCs give oxygen in \"pulses\" when the patient breathes in, so the patient should breathe through the nose. Keep the air vents uncovered, and never put the unit in a closed bag while it is running.<\/p><\/div>\n<div><i>\u2744\ufe0f<\/i><h4>Liquid oxygen<\/h4><p>Liquid oxygen is about \u2212297\u00b0F. Keep the reservoir upright and in a ventilated area. Only trained people fill portable units, wearing gloves. If liquid oxygen touches the skin, do not rub it. Warm the area with lukewarm water and call 911 for frostbite.<\/p><\/div>\n<\/div>\n<div class=\"g-steps\">\n<div><h4>Turning a cylinder on<\/h4><p>Make sure the regulator is attached. Open the valve slowly, counter-clockwise, with the correct key.<\/p><\/div>\n<div><h4>Set the prescribed flow<\/h4><p>If the setting is part of your tasks, set the dial to the ordered LPM only.<\/p><\/div>\n<div><h4>Check the gauge<\/h4><p>Note how full the tank is. Report it when it is low.<\/p><\/div>\n<div><h4>Turning it off<\/h4><p>Close the valve clockwise when finished, and let the gauge drop to zero.<\/p><\/div>\n<\/div>"
   },

    "html": "<ol>\n<li>Oxygen is a prescribed medication. Never change the flow rate.<\/li>\n<li>No smoking or open flames within 10 feet, and no heat sources within 5 feet.<\/li>\n<li>Use water-based products only. No petroleum jelly or oils.<\/li>\n<li>Secure cylinders upright, store them ventilated, and never leave them in a hot car.<\/li>\n<li>Clean the cannula, humidifier, and filters as scheduled. Use distilled water.<\/li>\n<li>Plan travel with enough oxygen and secure tanks in vehicles.<\/li>\n<li>Watch for low oxygen (blue lips, confusion, shortness of breath) and too much oxygen (drowsiness in COPD).<\/li>\n<li>Call 911 for emergencies, then notify your RN. Call the supplier for equipment problems. Document facts.<\/li>\n<\/ol>"

  "intro": "<p>This competency training is for <strong>Registered Nurses (RN)<\/strong> and <strong>Licensed Practical Nurses (LPN)<\/strong> who collect specimens and perform point-of-care testing for Complete Home Care Services patients under the agency's laboratory certificate (<strong>CLIA #33D093518<\/strong>).<\/p>\n<div class=\"g-icons\">\n<div><i>\ud83e\uddea<\/i><h4>Part 1: Skills &amp; Procedures<\/h4><p>Safety, orders, patient ID, specimen collection, labeling, handling, storage, transport, and requisitions.<\/p><\/div>\n<div><i>\u2699\ufe0f<\/i><h4>Part 2: Quality<\/h4><p>Equipment maintenance, calibration, quality control, system failures, and corrective action.<\/p><\/div>\n<div><i>\ud83e\ude78<\/i><h4>Part 3: Blood Glucose<\/h4><p>Glucometer use, QC, normal ranges, and when to call the ordering physician, plus the competency test.<\/p><\/div>\n<\/div>\n<div class=\"g-note\"><p>This training covers the <strong>Assessment of Initial Training<\/strong> on the RN/LPN Competency Checklist and Part A of the Blood Glucose Monitoring competency test. Your RN supervisor will also observe you perform a test on a <strong>blind specimen<\/strong> (Part B) and repeat the review <strong>annually<\/strong>.<\/p><\/div>",
  "steps": [
   {
    "type": "lesson",
    "title": "CLIA, Waived Testing & Your Responsibilities",
    "html": "<p>The federal <strong>Clinical Laboratory Improvement Amendments (CLIA)<\/strong> regulate all testing performed on human specimens, including simple tests done in a patient's home such as fingerstick blood glucose. New York State oversees laboratories through the <strong>NYS Department of Health Clinical Laboratory Evaluation Program<\/strong>.<\/p>\n<div class=\"g-stats\">\n<div><b>CLIA<\/b><span>#33D093518: the agency's certificate number<\/span><\/div>\n<div><b>Waived<\/b><span>Simple tests with a low risk of error, like glucometers<\/span><\/div>\n<div><b>Annual<\/b><span>Competency review for every testing nurse<\/span><\/div>\n<\/div>\n<p>\"Waived\" does <strong>not<\/strong> mean \"no rules.\" Errors in waived testing still cause harm. CLIA requires testing personnel to:<\/p>\n<ul class=\"g-check\"><li>Follow the <strong>manufacturer's instructions<\/strong> exactly, every time.<\/li><li>Use only tests and supplies approved by the agency, and never use expired strips or controls.<\/li><li>Be trained and assessed for competency before testing, and at least annually.<\/li><li>Document results, quality control, maintenance, and corrective actions.<\/li><\/ul>\n<h3>How your competency is assessed<\/h3>\n<div class=\"g-icons\">\n<div><i>\ud83d\udc40<\/i><h4>Direct observation<\/h4><p>Your supervisor watches you perform the test.<\/p><\/div>\n<div><i>\ud83d\udccb<\/i><h4>Records review<\/h4><p>Results, QC logs, and maintenance records are checked.<\/p><\/div>\n<div><i>\ud83e\udde9<\/i><h4>Problem solving<\/h4><p>Quizzes and scenarios, like this training.<\/p><\/div>\n<div><i>\ud83c\udfaf<\/i><h4>Blind specimen<\/h4><p>You test a sample with an unknown value. Your result is compared with the known value.<\/p><\/div>\n<div><i>\ud83d\udd27<\/i><h4>Maintenance<\/h4><p>Observation of equipment checks and function checks.<\/p><\/div>\n<div><i>\ud83d\udcdd<\/i><h4>Documentation<\/h4><p>Recording and reporting results accurately.<\/p><\/div>\n<\/div>"
   },
   {
    "type": "lesson",
    "title": "Safety, Training Records & the Procedure Manual",
    "html": "<div class=\"g-steps\">\n<div><h4>Perform all safety procedures as written<\/h4><p>Hand hygiene, standard precautions, PPE, sharps safety, and the agency's exposure control plan, with no shortcuts.<\/p><\/div>\n<div><h4>Provide documentation of education<\/h4><p>Give HR copies of your license, prior lab or phlebotomy training, and competency records. Keep your license current.<\/p><\/div>\n<div><h4>Read and sign off on the procedure manual<\/h4><p>Read the agency's testing and specimen collection procedures, ask questions, and sign the acknowledgement. Re-sign when procedures change.<\/p><\/div>\n<\/div>\n<div class=\"g-note only-rn\"><p><strong>RN:<\/strong> as an RN you may be asked to observe and assess other nurses' competency. Use the same checklist and document what you observed.<\/p><\/div>\n<div class=\"g-note only-lpn\"><p><strong>LPN:<\/strong> you perform testing and specimen collection under the direction of the RN and physician orders. Report results and any problems to the RN supervisor.<\/p><\/div>"
   },

   {
    "type": "lesson",
    "title": "Orders & Patient Identification",
    "html": "<h3>Before obtaining any specimen<\/h3>\n<div class=\"g-steps\">\n<div><h4>Verify a signed order<\/h4><p>Confirm that Complete Home Care Services (CHC) has the physician's signed order for the test before the specimen is collected.<\/p><\/div>\n<div><h4>Check the details<\/h4><p>Test(s) ordered, collection site, timing (for example fasting, or a trough level), and any special handling.<\/p><\/div>\n<div><h4>Central lines<\/h4><p>Take a specimen from a <strong>central venous catheter (CVC) only if the orders specify it<\/strong>, following the agency's CVC policy.<\/p><\/div>\n<div><h4>Confirm identity<\/h4><p>Use <strong>two patient identifiers<\/strong> (for example, full name and date of birth). Ask the patient to state them, and compare with the requisition and labels.<\/p><\/div>\n<\/div>\n<div class=\"g-warn only-rn\"><p><strong>RN responsibility:<\/strong> the RN must confirm that CHC has the signed MD's order before the specimen is obtained.<\/p><\/div>\n<div class=\"g-warn only-lpn\"><p><strong>LPN:<\/strong> before collecting, confirm with the RN supervisor that CHC has the signed MD's order. Never collect on a verbal request from the family.<\/p><\/div>\n<div class=\"g-scenario\"><h4>What would you do?<\/h4><p>The family says the doctor \"wants bloodwork today,\" but you cannot find a signed order in the chart.<\/p>\n<details><summary>See the answer<\/summary><p>Do not collect the specimen. Contact the RN supervisor or the office to obtain and confirm the signed physician order first. Document the situation.<\/p><\/details><\/div>"
   },

    "q": "When may a blood specimen be drawn from a patient's central venous catheter (CVC)?",

   {
    "type": "lesson",
    "title": "Preparing the Site & Collecting the Specimen",
    "html": "<div class=\"g-steps\">\n<div><h4>Prepare<\/h4><p>Gather supplies, and check expiration dates on tubes, containers, and antiseptic. Explain the procedure and obtain consent.<\/p><\/div>\n<div><h4>Hand hygiene &amp; new gloves<\/h4><p><strong>New gloves are worn for each and every venipuncture<\/strong> or fingerstick.<\/p><\/div>\n<div><h4>Choose the site<\/h4><p>Avoid arms with an IV, fistula or graft, the side of a mastectomy, hematomas, scarring, or edema.<\/p><\/div>\n<div><h4>Clean the site<\/h4><p>Use the antiseptic in the procedure (for example, 70% alcohol). Let it <strong>air dry<\/strong>, because wet alcohol can hemolyze the sample and affect results.<\/p><\/div>\n<div><h4>Collect correctly<\/h4><p>Use the correct tubes or containers and the order of draw in the procedure manual. Fill tubes to the required volume, and invert additive tubes gently as directed.<\/p><\/div>\n<div><h4>Finish<\/h4><p>Release the tourniquet within about 1 minute, remove the needle, and activate the safety device.<\/p><\/div>\n<\/div>\n<div class=\"g-do\">\n<div class=\"do\"><h4>Do<\/h4><ul><li>Collect the right specimen type for each test ordered.<\/li><li>Follow the timing instructions (fasting, peak or trough).<\/li><li>Keep the patient comfortable and safe from fainting.<\/li><\/ul><\/div>\n<div class=\"dont\"><h4>Don't<\/h4><ul><li>Reuse gloves between procedures or patients.<\/li><li>Draw above an IV infusion site.<\/li><li>Shake tubes vigorously.<\/li><\/ul><\/div>\n<\/div>"
   },
   {
    "type": "lesson",
    "title": "Labeling the Specimen",
    "html": "<p>An unlabeled or mislabeled specimen can lead to a wrong diagnosis or treatment. Label <strong>at the bedside, in the patient's presence, immediately after collection<\/strong>.<\/p>\n<div class=\"g-icons\">\n<div><i>\ud83d\udc64<\/i><h4>Patient name<\/h4><p>Full name, spelled exactly as on the requisition.<\/p><\/div>\n<div><i>\ud83c\udf82<\/i><h4>Second identifier<\/h4><p>Date of birth or medical record number.<\/p><\/div>\n<div><i>\ud83d\udd52<\/i><h4>Date &amp; time<\/h4><p>The actual date and time of collection.<\/p><\/div>\n<div><i>\u270d\ufe0f<\/i><h4>Collector<\/h4><p>Your initials.<\/p><\/div>\n<div><i>\ud83e\uddfe<\/i><h4>Specimen type<\/h4><p>Source or site when required (for example, \"urine, clean catch\").<\/p><\/div>\n<div><i>\ud83c\udff7\ufe0f<\/i><h4>Lab label<\/h4><p>Use the lab's barcode label when provided, placed straight along the tube.<\/p><\/div>\n<\/div>\n<div class=\"g-warn\"><p>Never pre-label empty tubes, and never label specimens later in the car or office.<\/p><\/div>"
   },
   {
    "type": "lesson",
    "title": "Handling, Storage, Acceptance & Rejection Criteria",
    "html": "<h3>Handling and storage requirements<\/h3>\n<div class=\"g-table-wrap\"><table class=\"g-table\"><tr><th>Requirement<\/th><th>What to do<\/th><\/tr>\n<tr><td>Temperature<\/td><td>Keep at room temperature, refrigerated (2\u20138\u00b0C), on ice, or frozen <strong>exactly as the lab requires<\/strong> for each test.<\/td><\/tr>\n<tr><td>Light-sensitive tests<\/td><td>Protect from light (for example, bilirubin) by wrapping in foil or using an amber container.<\/td><\/tr>\n<tr><td>Time limits<\/td><td>Deliver within the stability time for the test. Note the collection time on the requisition.<\/td><\/tr>\n<tr><td>Position<\/td><td>Keep tubes upright, and avoid shaking or extreme heat in vehicles.<\/td><\/tr><\/table><\/div>\n<h3>Why a lab rejects specimens<\/h3>\n<div class=\"g-icons\">\n<div><i>\ud83c\udff7\ufe0f<\/i><h4>Labeling problems<\/h4><p>Unlabeled or mislabeled, or labels that don't match the requisition.<\/p><\/div>\n<div><i>\ud83e\ude78<\/i><h4>Hemolyzed or clotted<\/h4><p>Caused by traumatic draws, shaking, wet alcohol, or not mixing additive tubes.<\/p><\/div>\n<div><i>\u2696\ufe0f<\/i><h4>Quantity not sufficient<\/h4><p>Tube under-filled, or the wrong blood-to-additive ratio.<\/p><\/div>\n<div><i>\ud83e\uddea<\/i><h4>Wrong container<\/h4><p>Wrong tube type, or an expired tube.<\/p><\/div>\n<div><i>\u23f0<\/i><h4>Too old or wrong temperature<\/h4><p>Outside the stability time or temperature range.<\/p><\/div>\n<div><i>\ud83d\udca7<\/i><h4>Leaking<\/h4><p>A leaking or broken container is a safety hazard as well as being unusable.<\/p><\/div>\n<\/div>"
   },

   {
    "type": "lesson",
    "title": "Sharps Disposal & Checking the Collection Site",
    "html": "<ul class=\"g-check\"><li>Activate the needle's safety device and dispose of needles and lancets <strong>immediately<\/strong> in a puncture-resistant sharps container. Never recap.<\/li><li>Apply pressure with gauze until bleeding stops. Patients on anticoagulants may need longer pressure.<\/li><li><strong>Check the collection site for bleeding<\/strong> or hematoma before you apply the bandage and before you leave.<\/li><li>Ask the patient to keep the bandage on as directed, and report bleeding that does not stop.<\/li><li>Remove gloves and perform hand hygiene.<\/li><\/ul>\n<div class=\"g-note\"><p>Report any needlestick or blood exposure to your supervisor immediately, following the Bloodborne Pathogens exposure procedure.<\/p><\/div>"
   },
   {
    "type": "lesson",
    "title": "Completing the Lab Requisition",
    "html": "<p>The requisition is the lab's instructions. Incomplete forms delay results or cause tests to be cancelled.<\/p>\n<div class=\"g-icons\">\n<div><i>\ud83e\uddea<\/i><h4>Tests required<\/h4><p>Exactly as ordered, including special instructions.<\/p><\/div>\n<div><i>\ud83d\udc64<\/i><h4>Patient information<\/h4><p>Name, date of birth, sex, address, and insurance information as required.<\/p><\/div>\n<div><i>\ud83e\ude7a<\/i><h4>Physician information<\/h4><p>Ordering physician's name, NPI, phone or fax, and the address to report results to.<\/p><\/div>\n<div><i>\ud83d\uddc2\ufe0f<\/i><h4>Diagnosis<\/h4><p>Diagnosis code(s) supporting medical necessity, as on the order.<\/p><\/div>\n<div><i>\ud83d\udd52<\/i><h4>Collection details<\/h4><p>Date, time, specimen type, and collector's initials. Include fasting status if relevant.<\/p><\/div>\n<div><i>\u260e\ufe0f<\/i><h4>Agency contact<\/h4><p>The CHC phone number, for critical values and questions.<\/p><\/div>\n<\/div>"

   {
    "type": "lesson",
    "title": "Transporting Specimens",
    "html": "<div class=\"g-steps\">\n<div><h4>Primary container<\/h4><p>A tightly capped, labeled tube or container.<\/p><\/div>\n<div><h4>Biohazard bag<\/h4><p>Place it in a sealed, leak-proof biohazard specimen bag with absorbent material.<\/p><\/div>\n<div><h4>Puncture-proof outer container<\/h4><p>Patient specimens are transported in a <strong>rigid, puncture-proof container<\/strong> (a transport box or cooler) marked with the biohazard symbol.<\/p><\/div>\n<div><h4>Paperwork separate<\/h4><p>Put the requisition in the bag's outside pocket so it stays clean and dry.<\/p><\/div>\n<div><h4>Temperature control<\/h4><p>Use ice packs or a cooler as required. Do not let specimens sit in a hot or freezing car.<\/p><\/div>\n<div><h4>Deliver promptly<\/h4><p>Deliver to the lab within the required time, and document the hand-off if required.<\/p><\/div>\n<\/div>"
   },
   {
    "type": "lesson",
    "title": "Equipment Maintenance, Calibration & Quality Control",
    "html": "<p>Testing equipment such as glucometers must be maintained and checked at the <strong>intervals the manufacturer prescribes<\/strong>, and every check must be documented.<\/p>\n<div class=\"g-table-wrap\"><table class=\"g-table\"><tr><th>Check<\/th><th>Purpose<\/th><th>Document<\/th><\/tr>\n<tr><td>Function check / self-test<\/td><td>Confirms the meter powers on and the display works<\/td><td>Date, meter ID, result<\/td><\/tr>\n<tr><td>Calibration / coding<\/td><td>Matches the meter to the strip lot, if required by the model<\/td><td>Strip lot, code<\/td><\/tr>\n<tr><td>Quality control (QC)<\/td><td>Tests control solutions with known ranges<\/td><td>Control lot, expiration, result, pass or fail<\/td><\/tr>\n<tr><td>Cleaning &amp; disinfection<\/td><td>Prevents cross-infection between patients<\/td><td>Date, product used<\/td><\/tr>\n<tr><td>Storage temperature<\/td><td>Strips and controls must stay within the labeled range<\/td><td>Temperature, if required<\/td><\/tr><\/table><\/div>\n<h3>QC is tested the same way as patient specimens<\/h3>\n<p>Run control solutions <strong>in the same manner as patient specimens<\/strong>, using the same meter, strips, and technique, and record all necessary information accurately. If QC is out of range, <strong>do not test patients<\/strong> until the problem is corrected.<\/p>"

   {
    "type": "lesson",
    "title": "Recognizing System Failures & Taking Action",
    "html": "<div class=\"g-icons\">\n<div><i>\ud83d\udcc9<\/i><h4>Calibration failure<\/h4><p>The meter will not calibrate, shows error codes, or QC fails repeatedly.<\/p><\/div>\n<div><i>\ud83c\udf21\ufe0f<\/i><h4>Temperature problems<\/h4><p>Strips or controls stored too hot or cold, or incubator and refrigerator temperatures out of range.<\/p><\/div>\n<div><i>\u2753<\/i><h4>Inconsistent results<\/h4><p>A result does not match the patient's condition (for example, 40 mg/dL in an alert, well patient), or repeat tests disagree.<\/p><\/div>\n<\/div>\n<div class=\"g-steps\">\n<div><h4>Stop<\/h4><p>Do not report a questionable result as final.<\/p><\/div>\n<div><h4>Check<\/h4><p>Check the technique, site, strips, controls, meter, and expiration dates. Repeat the test or QC as the procedure directs.<\/p><\/div>\n<div><h4>Contact<\/h4><p>Contact the appropriate persons: the RN supervisor, ordering physician, laboratory, or manufacturer support, whenever questions arise about testing or reporting.<\/p><\/div>\n<div><h4>Document corrective action<\/h4><p>Record what happened, what you did, the results of re-testing, and who you notified.<\/p><\/div>\n<\/div>\n<div class=\"g-warn\"><p>If the patient has symptoms of low or high blood sugar, treat the <strong>patient<\/strong> according to the orders and emergency policy. Don't wait for the meter problem to be solved.<\/p><\/div>"
   },
   {
    "type": "lesson",
    "title": "Blood Glucose Monitoring: Procedure",
    "html": "<div class=\"g-steps\">\n<div><h4>Verify the order<\/h4><p>Glucose testing may require a physician order. Check the frequency, target ranges, and call parameters.<\/p><\/div>\n<div><h4>Prepare the meter<\/h4><p>Clean meter, strips and controls in date, and the meter coded if required. <strong>Perform QC before each use in the home<\/strong>, as agency policy requires, and at the frequency and number of levels the manufacturer recommends.<\/p><\/div>\n<div><h4>Identify &amp; explain<\/h4><p>Use two identifiers, explain the test, perform hand hygiene, and put on new gloves.<\/p><\/div>\n<div><h4>Clean the site<\/h4><p>Have the patient wash their hands with warm water, or use alcohol and let it air dry. Use the side of a fingertip.<\/p><\/div>\n<div><h4>Obtain the sample<\/h4><p>Lance, then wipe away the first drop if the manufacturer instructs. Apply the drop to the strip as directed.<\/p><\/div>\n<div><h4>Read &amp; respond<\/h4><p>Read the result, compare it with the ordered ranges, and act on call parameters.<\/p><\/div>\n<div><h4>Dispose<\/h4><p><strong>Lancets go in the sharps or puncture-proof container.<\/strong> Dispose of the strip, gauze, and gloves.<\/p><\/div>\n<div><h4>Clean &amp; document<\/h4><p>Disinfect the meter with an approved wipe. Document the result, time, QC, and any action taken or notification made.<\/p><\/div>\n<\/div>"

    "title": "Glucose Ranges & When to Call the Physician",
    "html": "<div class=\"g-stats\">\n<div><b>70\u2013120<\/b><span>mg/dL: the agency's normal reference range<\/span><\/div>\n<div><b>&lt; 70<\/b><span>mg/dL: call the ordering MD<\/span><\/div>\n<div><b>&gt; 300<\/b><span>mg/dL: call the ordering MD<\/span><\/div>\n<div><b>MD orders<\/b><span>Always follow the patient-specific call parameters<\/span><\/div>\n<\/div>\n<p>The RN/LPN should call the ordering physician for glucose levels <strong>less than 70<\/strong>, <strong>greater than 300<\/strong>, and <strong>as per the MD's orders<\/strong> (all of the above). Notify the RN supervisor and document the call.<\/p>\n<div class=\"g-do\">\n<div class=\"dont\"><h4>Hypoglycemia (low)<\/h4><ul><li>Shaky, sweaty, pale, hungry, fast heartbeat<\/li><li>Confusion, irritability, headache, drowsiness<\/li><li>Seizure or unresponsiveness: <strong>call 911<\/strong><\/li><li>If alert and able to swallow, follow the orders or protocol (often 15 g of fast-acting carbohydrate, then re-check in 15 minutes).<\/li><\/ul><\/div>\n<div class=\"dont\"><h4>Hyperglycemia (high)<\/h4><ul><li>Thirst, frequent urination, dry mouth<\/li><li>Fatigue, blurred vision, headache<\/li><li>Fruity breath, nausea or vomiting, deep rapid breathing (possible DKA): <strong>urgent<\/strong><\/li><li>Follow the orders and call parameters. Check ketones if ordered.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"g-note\"><p>Target ranges can differ for individual patients (for example, fasting goals, pregnancy, or older adults). <strong>Patient-specific MD orders always take priority<\/strong> over general ranges.<\/p><\/div>"
