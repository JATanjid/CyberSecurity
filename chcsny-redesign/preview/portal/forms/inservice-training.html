    if (combo) { combo.value = code; combo.dispatchEvent(new Event('change')); }
    else loadTranslate();
    rerender();
    waitTranslated(code, function () { hideLangLoading(); });
  }
  /* each time the portal draws a new page while translated, fade it in once Google has translated it */
  function afterRender() {
    if (!CONFIG.translate) return;
    var code = currentLang(); if (code === 'en' || !pageIsIn(code)) return;
    view.classList.add('ist-xlating');
    var pillTimer = setTimeout(function () { xpill.hidden = false; }, 600);
    var start = Date.now(), last = Date.now();
    var mo = new MutationObserver(function (recs) {
      for (var i = 0; i < recs.length; i++) { var t = recs[i].target; if (!(t.closest && t.closest('#ist-timer'))) { last = Date.now(); return; } }
    });
    mo.observe(view, { subtree: true, childList: true, characterData: true });
    var iv = setInterval(function () {
      var quiet = Date.now() - last, age = Date.now() - start;
      if ((age > 250 && quiet > 300) || age > 4000) {
        clearInterval(iv); mo.disconnect(); clearTimeout(pillTimer);
        view.classList.remove('ist-xlating'); xpill.hidden = true;
      }
    }, 80);
  }
  if (CONFIG.translate && currentLang() !== 'en') {
    showLangLoading(currentLang());
    loadTranslate();
    waitTranslated(currentLang(), function () { hideLangLoading(); }, 10000);
  }
  if (window.ResizeObserver) new ResizeObserver(applyView).observe(root);
  else window.addEventListener('resize', applyView);

  /* =================================================================
     HOME
     ================================================================= */
  function renderHome() {
    expireOld();
    root.classList.remove('ist-askup');
    var total = TRAININGS.length, done = 0;
    TRAININGS.forEach(function (t) { if (statusOf(t) === 'done') done++; });
    var pct = Math.round(done / total * 100);

    var cards = TRAININGS.map(function (t) {
      var st = statusOf(t), p = state.progress[t.id] || { max: 0 };
      var ext = t.type === 'external';
      var n = ext ? 2 : pagesOf(t).length - 1;
      var lessons = ext ? 0 : t.steps.filter(function (s) { return s.type === 'lesson'; }).length;
      var bar = st === 'done' ? 100 : ext ? (p.opened ? 50 : 0) : Math.round((p.max || 0) / n * 100);
      var pill = { new: '<span class="ist-pill">Not started</span>',
                   due: '<span class="ist-pill ist-pill-due">\u27f3 Due again</span>',
                   progress: '<span class="ist-pill ist-pill-prog">In progress</span>',
                   ready: '<span class="ist-pill ist-pill-ready">Ready to submit</span>',
                   done: '<span class="ist-pill ist-pill-done">' + CHECK_SVG.replace('<svg', '<svg width="13" height="13"') + ' Completed</span>' }[st];
      var actions;
      if (ext) {
        actions = '<button class="ist-btn' + (st === 'done' ? ' ist-btn-ghost' : '') + '" data-act="open" data-id="' + t.id + '">' + (st === 'done' ? 'View / upload new' : st === 'new' || st === 'due' ? 'Start training' : 'Upload certificate') + '</button>';
      } else if (st === 'done') {
        actions = '<button class="ist-btn ist-btn-ghost" data-act="open" data-id="' + t.id + '">Review</button>' +
                  '<button class="ist-btn ist-btn-ghost" data-act="dl-done" data-id="' + t.id + '">Certificate PDF</button>';
      } else {
        actions = '<button class="ist-btn" data-act="open" data-id="' + t.id + '">' + (st === 'new' || st === 'due' ? 'Start training' : st === 'ready' ? 'Finish & submit' : 'Continue') + '</button>';
      }
      return '<article class="ist-card' + (st === 'done' ? ' is-done' : '') + '" style="--c:' + t.color + '">' +
        '<div class="ist-card-top"><span class="ist-ico">' + icon(t.icon) + '</span>' + pill + '</div>' +
        '<h3>' + esc(t.title) + '</h3>' +
        '<p>' + esc(t.summary) + '</p>' +
        (t.audience || roleOf(t) ? '<div class="ist-meta">' + (t.audience ? '<b style="color:var(--c)">For ' + esc(t.audience) + ' staff</b>' + (roleOf(t) ? ' \u00b7 ' : '') : '') + (roleOf(t) ? 'Your role: <b>' + esc(roleOf(t).short) + '</b>' : '') + '</div>' : '') +
        (ext ? '<div class="ist-meta">External training \u00b7 ' + esc(t.provider) + ' \u00b7 <span style="white-space:nowrap">~' + t.minutes + ' min</span></div>' :
        '<div class="ist-meta">' + lessons + ' lessons \u00b7 ' + countOf(t, 'check') + ' knowledge checks \u00b7 ' + t.final.length + '-question final quiz \u00b7 <span style="white-space:nowrap">\u23f1 ~' + t.minutes + ' min</span>' +
          (st === 'progress' || st === 'ready' ? ' \u00b7 <span style="white-space:nowrap">' + spentMin(t) + ' min spent</span>' : '') + '</div>') +
        (st === 'done' ? '<div class="ist-done-date">Completed ' + esc(fmtDate(state.progress[t.id].completedAt)) + (state.progress[t.id].score != null && !ext ? ' \u00b7 Score ' + state.progress[t.id].score + '/' + t.final.length : '') + '</div>' +
          (CONFIG.resetMonths ? '<div class="ist-renew' + (dueDate(p) - new Date() < 30 * 864e5 ? ' soon' : '') + '">\u27f3 Renew by ' + esc(fmtDate(dueDate(p).toISOString())) + '</div>' : '') : '') +
        (st === 'due' ? '<div class="ist-renew soon">Last completed ' + esc(fmtDate(state.history[t.id].completedAt)) + '. This training is due again.</div>' : '') +
        '<div class="ist-cardbar" aria-hidden="true"><span style="width:' + bar + '%"></span></div>' +
        '<div class="ist-card-actions">' + actions + '</div>' +
        '</article>';
    }).join('');

    view.innerHTML =
      '<section class="ist-hero"><div class="ist-hero-grid">' +
        '<div><h1 class="ist-hero-org notranslate">' + esc(CONFIG.organization) + '</h1>' +
        '<div class="ist-hero-title">' + esc(CONFIG.portalTitle) + '</div>' +
        '<p>' + esc(CONFIG.portalSubtitle) + '</p></div>' +
        '<div class="ist-summary">' +
          '<div class="ist-summary-top"><span>Your progress</span><span><b>' + done + '</b> of ' + total + ' completed</span></div>' +
          '<div class="ist-sumbar"><span style="width:' + pct + '%"></span></div>' +
          '<div class="ist-namefield"><label for="ist-home-name">Employee full name (used on your certificates)</label>' +
          '<input id="ist-home-name" type="text" autocomplete="name" placeholder="First and last name" value="' + esc(state.name) + '"></div>' +
        '</div>' +
      '</div></section>' +
      '<section class="ist-home-body">' +
        (done === total ? '<div class="ist-allset"><span class="ist-success-ico" style="width:36px;height:36px;margin:0">' + CHECK_SVG + '</span>All in-service trainings are complete. Thank you!</div>' : '') +
        '<div class="ist-section-h"><h2>Trainings</h2></div>' +
        '<div class="ist-grid">' + cards + '</div>' +
        '<div class="ist-foot"><span>Progress is saved in this browser on this device.</span>' +
        '<button class="ist-link" data-act="reset">Clear my saved progress</button></div>' +
      '</section>';

    document.getElementById('ist-viewslot').innerHTML = viewSwitcher();
    var nameInput = document.getElementById('ist-home-name');
    nameInput.addEventListener('input', function () { state.name = nameInput.value; save(); });
    afterRender();
  }

  /* =================================================================
     TRAINING PLAYER
     ================================================================= */
  var cur = null; // { t, pages, i, sess }

  function preselectRole(t, p) {
    if (p.role || p.completedAt || !state.lastRole) return;
    if (rolesOf(t).some(function (r) { return r.id === state.lastRole; })) { p.role = state.lastRole; if (p.role === 'other') p.roleOther = state.lastRoleOther || ''; save(); }
  }
  function openTraining(t) {
    if (t.type === 'external') return openExternal(t);
    var p = prog(t.id); preselectRole(t, p);
    var pages = pagesOf(t);
    var start = p.completedAt ? 0 : Math.min(p.step || 0, pages.length - 1);
    if (!p.passed && start > pages.length - 3) start = pages.length - 3;
    cur = { t: t, pages: pages, i: start, sess: { checks: {}, finalAns: {}, finalMsg: null, submitting: false, msg: null } };
    renderTraining();
  }

  function canVisit(i) {
    var p = prog(cur.t.id);
    if (p.completedAt) return true;
    if (i > cur.pages.length - 3 && !p.passed) return false;
    return i <= (p.max || 0);
  }

  function go(i) {
    stopAudio();
    var p = prog(cur.t.id);
    cur.i = Math.max(0, Math.min(i, cur.pages.length - 1));
    p.step = cur.i;
    p.max = Math.max(p.max || 0, cur.i);
    save();
    renderTraining();
    scrollTop();
  }

  function renderTraining() {
    document.getElementById('ist-viewslot').innerHTML = '';
    var t = cur.t, pages = cur.pages, i = cur.i, pg = pages[i], p = prog(t.id);
    var pct = Math.round(i / (pages.length - 1) * 100);
    if (p.completedAt) pct = 100;

    var outline = pages.map(function (x, k) {
      var cls = k === i ? 'is-cur' : (k <= (p.max || 0) || p.completedAt ? 'is-seen' : '');
      var dot = cls === 'is-seen' ? CHECK_SVG.replace('<svg', '<svg width="11" height="11"') : '';
      return '<li><button data-act="goto" data-i="' + k + '" class="' + cls + '"' + (canVisit(k) && k !== i ? '' : (k === i ? ' aria-current="step"' : ' disabled')) + '>' +
             '<span class="ist-dot">' + dot + '</span><span>' + esc(x.label) + '</span></button></li>';
    }).join('');

    view.innerHTML =
      '<div class="ist-train" style="--c:' + t.color + '">' +
        topbarHtml(t, pct) +
        '<div class="ist-body">' +
          '<aside class="ist-outline"><h4>Training outline</h4><ol>' + outline + '</ol></aside>' +
          '<div class="ist-main">' +
            '<div class="ist-steprow"><div class="ist-steplabel">Step ' + (i + 1) + ' of ' + pages.length + ' \u00b7 ' + esc(pg.kind === 'lesson' ? 'Lesson' : pg.label) + '</div>' +
              '<span class="ist-timer" id="ist-timer" title="Time spent in this training">\u23f1 <span id="ist-timer-t">' + fmtClock(p.timeMs || 0) + '</span> <span style="font-weight:500">of ~' + t.minutes + ' min</span></span></div>' +
            '<div class="ist-panel" id="ist-panel">' + panelHtml(pg, i) + '</div>' +
            (pg.kind === 'cert' ? '' : '<div class="ist-nav">' + navHtml(pg, i) + '</div>') +
          '</div>' +
        '</div>' +
      '</div>';

    if (pg.kind === 'sign') initSignStep();
    labelTables();
    root.classList.add('ist-askup');
    afterRender();
  }

  function topbarHtml(t, pct) {
    return '<div class="ist-topbar">' +
          '<button class="ist-back" data-act="home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>All trainings</button>' +
          '<div class="ist-tb-title">' + esc(t.title) + ' <small>\u00b7 ' + esc(CONFIG.organization) + '</small></div>' +
          (CONFIG.translate ? '<label class="ist-langmini" title="Language">' + langSelect('mini') + '</label>' : '') +
          '<button class="ist-btn ist-btn-ghost ist-btn-sm" data-act="listen" id="ist-listen" aria-label="Listen to this page">' + speakerSvg() + '<span>Listen</span></button>' +
        '</div>' +
        '<div class="ist-progress" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"><span style="width:' + pct + '%"></span></div>';
  }
  function labelTables() {
    Array.prototype.forEach.call(view.querySelectorAll('table.g-table'), function (tb) {
      var rows = tb.querySelectorAll('tr'); if (!rows.length) return;
      var heads = Array.prototype.map.call(rows[0].children, function (c) { return c.textContent.trim(); });
      Array.prototype.forEach.call(rows, function (r, ri) { if (ri) Array.prototype.forEach.call(r.children, function (c, ci) { if (heads[ci]) c.setAttribute('data-label', heads[ci]); }); });
    });
  }
  function speakerSvg() {
    return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
  }

  function optionsHtml(name, q, selected, revealed) {
    return '<div class="ist-opts' + (revealed ? ' is-locked' : '') + '" role="radiogroup">' + q.options.map(function (o, k) {
      var cls = 'ist-opt';
      if (revealed) { if (k === q.answer) cls += ' is-right'; else if (k === selected) cls += ' is-wrong'; }
      else if (k === selected) cls += ' is-sel';
      return '<label class="' + cls + '"><input type="radio" name="' + name + '" value="' + k + '"' + (k === selected ? ' checked' : '') + (revealed ? ' disabled' : '') + '>' +
             '<span class="ist-radio"></span><span>' + esc(o) + '</span></label>';
    }).join('') + '</div>';
  }

  function panelHtml(pg, i) {
    var t = cur.t, p = prog(t.id), s = cur.sess;
    switch (pg.kind) {
      case 'intro':
        var lessons = countOf(t, 'lesson');
        return '<span class="ist-badge">Welcome</span><h2>' + esc(t.title) + '</h2><div class="ist-lesson">' + t.intro + '</div>' +
          '<div class="ist-lesson"><div class="g-stats">' +
            '<div><b>~' + t.minutes + ' min</b><span>Estimated time</span></div>' +
            '<div><b>' + lessons + '</b><span>Lessons</span></div>' +
            '<div><b>' + countOf(t, 'check') + '</b><span>Knowledge checks</span></div>' +
            '<div><b>' + needToPass(t) + '/' + t.final.length + '</b><span>Needed to pass the final quiz</span></div>' +
          '</div>' + '</div>' + detailsHtml(t) + '<div class="ist-lesson"><div class="g-note"><p><strong>Go at your own pace.</strong> The timer shows how long you have spent. If you already know the material you may finish sooner. The timer pauses when you leave this page or are inactive.</p></div></div>' +
          '<div class="ist-expect">' +
            '<div><b>1</b><span>Read ' + lessons + ' lessons</span></div>' +
            '<div><b>2</b><span>Answer ' + countOf(t, 'check') + ' knowledge checks</span></div>' +
            '<div><b>3</b><span>Pass the final quiz (' + needToPass(t) + ' of ' + t.final.length + ' correct)</span></div>' +
            '<div><b>4</b><span>Sign and submit your certificate</span></div>' +
          '</div>' +
          rolePickHtml(t, p, !!p.completedAt) +
          (p.completedAt ? '<div class="ist-fb ok" style="margin-top:16px">You completed this training on ' + esc(fmtDate(p.completedAt)) + '. You can review any section.</div>' : '');

      case 'lesson':
        return '<h2>' + esc(stripNum(pg.data.title)) + '</h2><div class="ist-readtime">\ud83d\udcd6 About ' + readMin(pg.data.html) + ' min read</div><div class="ist-lesson' + (p.role ? ' role-' + p.role : '') + '">' + pg.data.html + '</div>';

      case 'checklist':
        var ckd = p.checklist || {}, allDone = pg.data.items.every(function (x, k) { return ckd[k]; });
        return '<span class="ist-badge">Competency checklist</span><h2>' + esc(stripNum(pg.data.title)) + '</h2><div class="ist-lesson' + (p.role ? ' role-' + p.role : '') + '">' + pg.data.html + '</div>' +
          '<div class="ist-cklist">' + pg.data.items.map(function (it, k) {
            return '<label class="ist-opt ist-ckitem' + (ckd[k] ? ' is-sel' : '') + '"><input type="checkbox" class="ist-ck" data-k="' + k + '"' + (ckd[k] ? ' checked' : '') + '>' +
              '<span class="ist-check">' + CHECK_SVG.replace('<svg', '<svg width="14" height="14"') + '</span><span><b class="ist-cknum">' + (k + 1) + '.</b> ' + esc(it) + '</span></label>';
          }).join('') + '</div>' +
          '<div class="ist-inline-actions"><button class="ist-btn ist-btn-ghost ist-btn-sm" data-act="ckall">Check all</button></div>' +
          '<div class="ist-fb ' + (allDone ? 'ok' : 'warn') + '" id="ist-ckmsg">' + (allDone ? 'All ' + pg.data.items.length + ' skills confirmed.' : 'Check each skill to confirm you have reviewed it and can perform it as written.') + '</div>';

      case 'check':
        var c = s.checks[i] || {};
        var fb = '';
        if (c.revealed) fb = c.sel === pg.data.answer ? '<div class="ist-fb ok">Correct!</div>' : '<div class="ist-fb bad">Not quite. The correct answer is highlighted in green.</div>';
        else if (c.warn) fb = '<div class="ist-fb warn">Please choose an answer.</div>';
        return '<span class="ist-badge">Knowledge check</span>' +
          '<div class="ist-q"><div class="ist-qtext">' + esc(pg.data.q) + '</div>' + optionsHtml('chk' + i, pg.data, c.sel, c.revealed) + fb + '</div>' +
          (c.revealed ? '' : '<div class="ist-inline-actions"><button class="ist-btn" data-act="check">Check answer</button></div>');

      case 'final':
        if (p.passed && !s.retake) {
          return '<span class="ist-badge">Final quiz</span><h2>Final quiz passed</h2>' +
            '<div class="ist-fb ok">You scored ' + p.score + ' out of ' + t.final.length + '.</div>' +
            '<div class="ist-inline-actions"><button class="ist-btn ist-btn-ghost" data-act="retake">Retake quiz</button></div>';
        }
        var res = s.finalRes;
        var qs = t.final.map(function (q, k) {
          return '<div class="ist-q"><div class="ist-qtext">' + (k + 1) + '. ' + esc(q.q) + '</div>' + optionsHtml('fin' + k, q, s.finalAns[k], !!res) + '</div>';
        }).join('');
        var msg = '';
        if (s.finalMsg) msg = '<div class="ist-fb warn">' + esc(s.finalMsg) + '</div>';
        if (res) msg = res.pass
          ? '<div class="ist-fb ok">You scored ' + res.score + '/' + t.final.length + '. You passed! Continue to sign your certificate.</div>'
          : '<div class="ist-fb bad">You scored ' + res.score + '/' + t.final.length + '. You need ' + needToPass(t) + ' correct to pass. Review the lessons and try again.</div>';
        return '<span class="ist-badge">Final quiz</span><h2>Final quiz</h2><p>Answer all ' + t.final.length + ' questions. You need ' + needToPass(t) + ' correct to pass.</p>' + qs + msg +
          '<div class="ist-inline-actions">' +
            (!res ? '<button class="ist-btn" data-act="grade">Submit final quiz</button>' : '') +
            (res && !res.pass ? '<button class="ist-btn" data-act="retake">Try again</button><button class="ist-btn ist-btn-ghost" data-act="goto" data-i="1">Review lessons</button>' : '') +
          '</div>';

      case 'sign':
        return '<span class="ist-badge">Almost done</span><h2>Name &amp; signature</h2>' +
          (roleReady(t) ? '' : rolePickHtml(t, p, false)) +
          '<p>Your name and signature will appear on your certificate of completion.</p>' +
          '<div class="ist-field"><label for="ist-name">Employee full name</label>' +
          '<input id="ist-name" type="text" autocomplete="name" placeholder="First and last name" value="' + esc(state.name) + '">' +
          '<div class="ist-hint">Enter your first and last name.</div></div>' +
          '<div class="ist-field"><label>Employee signature</label><div id="ist-sigwrap"></div></div>' +
          '<div id="ist-signmsg"></div>';

      case 'cert':
        if (p.completedAt) return successHtml();
        var m = s.msg;
        return '<span class="ist-badge">Final step</span><h2>Review &amp; submit your certificate</h2>' +
          '<p>Check that your name and signature are correct, then press <strong>Submit certificate</strong>.</p>' +
          certPreview(t, state.name, state.signature, new Date().toISOString()) +
          (m ? '<div class="ist-fb ' + m.type + '">' + m.text + '</div>' : '') +
          '<div class="ist-inline-actions">' +
            '<button class="ist-btn ist-btn-ok" data-act="submit"' + (s.submitting ? ' disabled' : '') + '>' + (s.submitting ? '<span class="ist-spin"></span> Submitting\u2026' : 'Submit certificate') + '</button>' +
            '<button class="ist-btn ist-btn-ghost" data-act="dl">Download PDF</button>' +
            '<button class="ist-btn ist-btn-ghost" data-act="goto" data-i="' + (cur.pages.length - 2) + '">Edit name or signature</button>' +
          '</div>';
    }
    return '';
  }

  function successHtml() {
    var t = cur.t, p = prog(t.id);
    var next = null;
    for (var k = 0; k < TRAININGS.length; k++) if (statusOf(TRAININGS[k]) !== 'done') { next = TRAININGS[k]; break; }
    return '<div class="ist-success"><div class="ist-success-ico">' + CHECK_SVG + '</div>' +
      '<h2>Training complete</h2>' +
      '<p>Your certificate for <strong>' + esc(t.title) + '</strong> was submitted on ' + esc(fmtDate(p.completedAt)) + '.</p>' +
      '<div class="ist-inline-actions">' +
        (next ? '<button class="ist-btn" data-act="open" data-id="' + next.id + '">Next: ' + esc(next.title) + '</button>' : '') +
        '<button class="ist-btn ist-btn-ghost" data-act="home">Back to all trainings</button>' +
        (t.type === 'external'
          ? '<button class="ist-btn ist-btn-ghost" data-act="ext-new">Upload a new certificate</button>'
          : '<button class="ist-btn ist-btn-ghost" data-act="dl-done" data-id="' + t.id + '">Download certificate</button>') +
      '</div></div>';
  }

  function navHtml(pg, i) {
    var last = cur.pages.length - 1, p = prog(cur.t.id), s = cur.sess;
    var back = i > 0 ? '<button class="ist-btn ist-btn-ghost" data-act="prev">Back</button>' : '<button class="ist-btn ist-btn-ghost" data-act="home">Exit</button>';
    var nextLabel = 'Continue', disabled = false;
    if (pg.kind === 'intro') { nextLabel = p.completedAt ? 'Start review' : 'Start training'; disabled = !p.completedAt && !roleReady(cur.t); }
    if (pg.kind === 'checklist') { var items = pg.data.items, ck = p.checklist || {}; disabled = !p.completedAt && items.some(function (x, k) { return !ck[k]; }); }
    if (pg.kind === 'check') disabled = !(s.checks[i] && s.checks[i].revealed);
    if (pg.kind === 'final') { nextLabel = 'Continue to sign'; disabled = !p.passed; }
    if (pg.kind === 'sign') nextLabel = 'Preview certificate';
    if (i === last) return back + (p.completedAt ? '<button class="ist-btn" data-act="home">All trainings</button>' : '');
    return back + '<button class="ist-btn" data-act="next"' + (disabled ? ' disabled' : '') + '>' + nextLabel + '</button>';
  }

  /* =================================================================
     EXTERNAL TRAINING (e.g. NYC Sexual Harassment Prevention)
     Employee takes the training on the official site, then uploads
     the certificate here; it is sent to Google Drive like the others.
     ================================================================= */
  function openExternal(t) {
    preselectRole(t, prog(t.id));
    cur = { t: t, ext: true, sess: { file: null, attest: false, submitting: false, msg: null, redo: false } };
    renderExternal();
  }
  function renderExternal() {
    var t = cur.t, p = prog(t.id), s = cur.sess, done = p.completedAt && !s.redo;
    var pct = done ? 100 : p.opened ? 50 : 0;
    document.getElementById('ist-viewslot').innerHTML = '';
    var body;
    if (done) body = successHtml();
    else body =

  var MAX_UPLOAD = 8 * 1024 * 1024;
  function readExtFile(file) {
    var s = cur.sess;
    var isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    var isImg = /^image\//.test(file.type) || /\.(png|jpe?g|heic|heif|webp|gif)$/i.test(file.name);
    if (!isPdf && !isImg) { s.msg = { type: 'bad', text: 'Please choose a PDF or a photo/screenshot of your certificate.' }; return renderExternal(); }
    s.msg = { type: 'warn', text: 'Reading file\u2026' }; renderExternal();
    var done = function (dataUrl, mime, name) {
      var b64 = dataUrl.split(',')[1] || '';
      if (b64.length * 0.75 > MAX_UPLOAD) { s.file = null; s.msg = { type: 'bad', text: 'That file is too large (over 8 MB). Please choose a smaller file.' }; return renderExternal(); }
      s.file = { name: name, mime: mime, data: b64 }; s.msg = null; renderExternal();
    };
    var fr = new FileReader();
    fr.onerror = function () { s.msg = { type: 'bad', text: 'Could not read that file. Please try another.' }; renderExternal(); };
    fr.onload = function () {
      if (isPdf || !/^image\/(png|jpeg|webp|gif)$/.test(file.type)) return done(fr.result, isPdf ? 'application/pdf' : (file.type || 'image/jpeg'), file.name);
      /* shrink large photos so uploads are fast on phones */
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, 2000 / Math.max(img.width, img.height));
        if (k === 1 && file.size < 2.5 * 1024 * 1024) return done(fr.result, file.type, file.name);
        var c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
        done(c.toDataURL('image/jpeg', 0.85), 'image/jpeg', file.name.replace(/\.[^.]+$/, '') + '.jpg');
      };
      img.onerror = function () { done(fr.result, file.type, file.name); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  function postJson(url, payload, ms) {

  /* ---------- submit to Google Apps Script ---------- */
  function submitCert() {
    var t = cur.t, s = cur.sess, p = prog(t.id);
    if (s.submitting) return;
    var url = t.endpoint || CONFIG.submitUrl;
    if (!url || !/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) {
      s.msg = { type: 'bad', text: 'This training has no submission link set up yet. Please download the PDF and give it to your supervisor.' };
      return renderTraining();
    }
    var iso = new Date().toISOString(), name = state.name.trim();
    s.submitting = true; s.msg = null; renderTraining();
    if (window.CHCSPopup) CHCSPopup.building();
    refreshRnSettings(true).then(function () { return buildPdf(t, name, state.signature, iso); }).then(function (pdf) {
      if (window.CHCSPopup) CHCSPopup.submitting();
      var payload = {
        trainingId: t.id, trainingTitle: t.title, driveFolder: t.driveFolder,
        employeeName: name, role: roleOf(t) ? roleOf(t).short : '', score: p.score, total: t.final.length,
        passMark: needToPass(t), result: p.passed ? 'PASSED' : '', startedAt: p.startedAt || iso,
        lengthOfTraining: lengthLabel(t), platform: CONFIG.platform, rnSupervisor: CONFIG.rnSupervisor.name + ', ' + CONFIG.rnSupervisor.title, timeSpentMin: Math.max(1, spentMin(t)), completedAt: iso,
        fileName: fileNameFor(t, name),
        fileData: pdf.output('datauristring').split(',')[1]
      };
      var ctrl = window.AbortController ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 90000);
      /* text/plain body = "simple" request, so no CORS preflight is needed for Apps Script */
      return fetch(url, { method: 'POST', body: JSON.stringify(payload), redirect: 'follow', signal: ctrl ? ctrl.signal : undefined })
        .then(function (r) { clearTimeout(timer); return r.text(); })
        .then(function (txt) {
          var j; try { j = JSON.parse(txt); } catch (e) { throw new Error('The submission link did not respond correctly. Ask your administrator to check the Apps Script deployment.'); }
          if (j.status !== 'success') throw new Error(j.message || 'Submission failed.');
          p.completedAt = iso; p.fileUrl = j.fileUrl || ''; p.certName = name; p.certSig = state.signature; p.certMinutes = Math.max(1, spentMin(t));
          p.certRn = { name: CONFIG.rnSupervisor.name, title: CONFIG.rnSupervisor.title, email: CONFIG.rnSupervisor.email, phone: CONFIG.rnSupervisor.phone };
          save();
        });
    }).then(function () {
      if (window.CHCSPopup) CHCSPopup.done('Your certificate was sent to the office.');
      try { if (window.parent !== window) window.parent.postMessage({ type: 'chcs-inservice-complete', id: t.id, title: t.title, name: name, score: t.final && t.final.length ? Math.round((p.score || 0) / t.final.length * 100) : 100 }, location.origin); } catch (e) { /* not inside the portal */ }

      s.submitting = false;
      var msg = err && err.name === 'AbortError' ? 'The submission timed out.' : (err && err.message) || 'Something went wrong.';
      if (err instanceof TypeError) msg = 'Could not reach the submission server. Check your internet connection and try again.';
      s.msg = { type: 'bad', text: esc(msg) + ' Your progress is saved. You can try again, or download the PDF as a backup.' };
      renderTraining();
    });
  }

  /* ---------- narration ---------- */
  var speaking = false;
  function stopAudio() { try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {} speaking = false; setListenBtn(); }
  function setListenBtn() {
    var b = document.getElementById('ist-listen'); if (!b) return;
    b.querySelector('span').textContent = speaking ? 'Stop' : 'Listen';
  }
  function toggleAudio() {
    if (!('speechSynthesis' in window)) { alert('Audio narration is not supported in this browser.'); return; }
    if (speaking) return stopAudio();
    var panel = document.getElementById('ist-panel'); if (!panel) return;
    var clone = panel.cloneNode(true);
    Array.prototype.forEach.call(clone.querySelectorAll('button,.ist-badge,.ist-pad,input'), function (n) { n.remove(); });
    var u = new SpeechSynthesisUtterance(clone.innerText.replace(/\s+/g, ' ').trim());
    var lc = CONFIG.translate ? currentLang() : 'en', base = lc.split('-')[0];
    u.rate = 0.92; u.lang = lc === 'en' ? 'en-US' : lc;
    var voices = speechSynthesis.getVoices().filter(function (v) { return v.lang.toLowerCase().indexOf(base.toLowerCase()) === 0; });
    var pref = /zira|samantha|victoria|ava|allison|aria|jenny|female|susan|hazel|moira|karen|serena/i;
    u.voice = voices.filter(function (v) { return pref.test(v.name); })[0] || voices[0] || null;
    u.onend = u.onerror = function () { speaking = false; setListenBtn(); };
    speechSynthesis.cancel(); speechSynthesis.speak(u); speaking = true; setListenBtn();
  }

      if (!roleReady(cur.t)) { out.innerHTML = '<div class="ist-fb bad">Please choose your role (RN, LPN, PCA, HHA or Other) above.</div>'; return; }
      state.name = n;
      if (!validName(n)) { out.innerHTML = '<div class="ist-fb bad">Please enter your full name (first and last).</div>'; document.getElementById('ist-name').focus(); return; }
      if (pad) {
        if (!pad.has()) { out.innerHTML = '<div class="ist-fb bad">Please sign in the box above.</div>'; return; }
        state.signature = pad.data(); s.resign = false;
      } else if (!state.signature) { out.innerHTML = '<div class="ist-fb bad">Please add your signature.</div>'; return; }
      save();
    }
    go(cur.i + 1);
  }

  /* ---------- time system: counts active time spent in each training ---------- */
  var lastAct = Date.now(), tickN = 0;
  ['pointerdown', 'keydown', 'scroll', 'touchstart', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, function () { lastAct = Date.now(); }, { passive: true, capture: true });
  });
  setInterval(function () {
    if (!cur || cur.ext) return;
    var el = document.getElementById('ist-timer'), active = !document.hidden && (Date.now() - lastAct) < CONFIG.idleMinutes * 60000;
    var p = prog(cur.t.id);
    if (active && !p.completedAt) { p.timeMs = (p.timeMs || 0) + 1000; if (++tickN % 15 === 0) save(); }
    if (el) {
      el.classList.toggle('is-paused', !active && !p.completedAt);
      var tt = document.getElementById('ist-timer-t'); if (tt) tt.textContent = fmtClock(p.timeMs || 0) + (!active && !p.completedAt ? ' (paused)' : '');
    }
  }, 1000);
  document.addEventListener('visibilitychange', function () { if (document.hidden) save(); else lastAct = Date.now(); });
  window.addEventListener('pagehide', save);

  /* ---------- routing ---------- */
  function route() {
    stopAudio();
    var m = location.hash.match(/^#\/training\/([\w-]+)/), t = m && byId(m[1]);
    if (t) openTraining(t); else { cur = null; renderHome(); }
    scrollTop();
    if (rnReady) refreshRnAndRedraw(false);
  }
  window.addEventListener('hashchange', route);
  var rnReady = false;

  /* ---------- RN settings (name, credentials, email, phone) from the RN Review portal ---------- */
  var RN_KEY = 'chcs-rn-settings';
  function applyRnSettings(st) {
    if (!st || !st.rnName) return false;
    var name = String(st.rnName).trim(), cred = String(st.rnCredentials || '').trim();
    var next = { name: name, title: cred, email: String(st.rnEmail || CONFIG.rnSupervisor.email).trim(), phone: String(st.rnPhone || CONFIG.rnSupervisor.phone).trim() };
    var changed = JSON.stringify(next) !== JSON.stringify(CONFIG.rnSupervisor);
    CONFIG.rnSupervisor = next;
    CONFIG.instructorName = name + (cred ? ', ' + cred : '');
    return changed;
  }
  var rnFetch = null, rnFetchedAt = 0;
  /* Gets the latest RN settings from the training Apps Script.
     force: always ask the server (Ask RN, certificates); otherwise at most every 20 seconds.
     Always resolves (falls back to the saved/default details after 8 seconds). */
  function refreshRnSettings(force) {
    var url = CONFIG.submitUrl;
    if (!CONFIG.loadRnSettings || !url) return Promise.resolve(false);
    if (rnFetch) return rnFetch;
    if (!force && Date.now() - rnFetchedAt < 20000) return Promise.resolve(false);
    var req = fetch(url + (url.indexOf('?') > -1 ? '&' : '?') + 'action=settings&t=' + Date.now(), { redirect: 'follow', cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        rnFetchedAt = Date.now();
        if (!j || !j.settings) return false;
        try { localStorage.setItem(RN_KEY, JSON.stringify(j.settings)); } catch (e) {}
        return applyRnSettings(j.settings);
      }).catch(function () { return false; });
    var timeout = new Promise(function (res) { setTimeout(function () { res(false); }, 8000); });
    rnFetch = Promise.race([req, timeout]).then(function (changed) { rnFetch = null; return changed; });
    return rnFetch;
  }
  /* refresh in the background and redraw the page if the RN changed (never while signing) */
  function refreshRnAndRedraw(force) {
    return refreshRnSettings(force).then(function (changed) {
      var busySign = cur && !cur.ext && cur.pages && cur.pages[cur.i] && cur.pages[cur.i].kind === 'sign';
      var submitting = cur && cur.sess && cur.sess.submitting;
      if (changed && !busySign && !submitting) rerender();
      return changed;
    });
  }
  function loadRnSettings() {
    try { applyRnSettings(JSON.parse(localStorage.getItem(RN_KEY) || 'null')); } catch (e) {}
    refreshRnAndRedraw(true);
  }
  /* Certificates keep the RN they were issued with: build them with that RN, then switch back. */
  function withRn(rn, fn) {
    if (!rn || !rn.name) return fn();
    var keep = { sup: CONFIG.rnSupervisor, ins: CONFIG.instructorName };
    CONFIG.rnSupervisor = rn; CONFIG.instructorName = rn.name + (rn.title ? ', ' + rn.title : '');
    var restore = function () { CONFIG.rnSupervisor = keep.sup; CONFIG.instructorName = keep.ins; };
    try { return Promise.resolve(fn()).then(function (v) { restore(); return v; }, function (e) { restore(); throw e; }); }
    catch (e) { restore(); throw e; }
  }
  loadRnSettings();
  rnReady = true;

  applyView();
  route();
})();
</script>
</div>
