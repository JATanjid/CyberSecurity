  "driveFolder": "Workplace Violence Prevention & Safety",
  "intro": "<p>This interactive module covers workplace violence recognition, de-escalation strategies, OSHA safety guidelines, risk mitigation in home care environments, and emergency reporting protocols.<\/p>",
  "steps": [
   {
    "type": "lesson",
    "title": "1. Understanding Workplace Violence",
    "html": "<p>Workplace violence encompasses any act or threat of physical violence, harassment, intimidation, or other threatening disruptive behavior that occurs at the work site or in home care settings.<\/p> <div class=\"card\"> <p><span class=\"term\">Type I (Criminal Intent):<\/span> Violence by an individual with no legitimate relationship to the business or patient home (e.g., robbery, trespassing).<\/p> <p><span class=\"term\">Type II (Customer/Client/Patient):<\/span> Violence directed at healthcare staff by patients, clients, or family members during service delivery.<\/p> <p><span class=\"term\">Type III (Worker-on-Worker):<\/span> Violence, lateral bullying, or harassment between current or former employees.<\/p> <p><span class=\"term\">Type IV (Personal Relationship):<\/span> Violence committed in the workplace by someone who has a personal relationship with an employee (e.g., domestic violence spilling into work).<\/p> <\/div>"
   },
   {
    "type": "check",
    "q": "Which category describes violence directed at a home health aide by a patient's family member?",
    "options": [
     "Type I (Criminal Intent)",
     "Type II (Customer/Client/Patient)",
     "Type III (Worker-on-Worker)"
    ],
    "answer": 1
   },
   {
    "type": "lesson",
    "title": "2. Environmental Risk Factors in Home Care",
    "html": "<p>Home health personnel face unique safety challenges due to working in uncontrolled home environments:<\/p> <div class=\"card\"> <p><strong>Isolated Work Settings:<\/strong> Staff often work alone in private residences without immediate peer or security support.<\/p> <p><strong>Unfamiliar Neighborhoods &amp; Access Points:<\/strong> Working during late hours or entering poorly lit, unsecure areas increases vulnerability.<\/p> <p><strong>Substance Use &amp; Weapons in Homes:<\/strong> Unsecured firearms, aggressive pets, or presence of intoxicated household members present acute safety risks.<\/p> <p><strong>Patient Cognitive Alterations:<\/strong> Behavioral symptoms associated with dementia, delirium, or psychiatric disorders can trigger sudden agitation.<\/p> <\/div> <h2>3. Verbal De-Escalation Techniques<\/h2> <p>When encountering verbal aggression or agitation, staff must utilize non-confrontational strategies:<\/p> <div class=\"card\"> <p><strong>Maintain Physical Distance:<\/strong> Stay at least two arm lengths away and ensure a clear exit route toward the doorway.<\/p> <p><strong>Calm &amp; Neutral Communication:<\/strong> Speak in a soft, non-judgmental tone. Avoid arguing, interrupting, or matching elevated emotions.<\/p> <p><strong>Open Body Posture:<\/strong> Keep hands visible and relaxed. Avoid crossed arms, pointing fingers, or standing directly face-to-face.<\/p> <\/div>"
   },
   {
    "type": "check",
    "q": "When a person in a home care setting becomes verbally aggressive, what is the best immediate response?",
    "options": [
     "Argue with the individual to assert authority.",
     "Stand close and block the nearest doorway.",
     "Maintain a safe physical distance, speak calmly, and ensure an open exit path."
    ],
    "answer": 2
   },
   {
    "type": "lesson",
    "title": "4. Emergency Action & Evacuation Protocols",
    "html": "<p>If a situation escalates to immediate physical threat or imminent danger, personal safety takes absolute priority:<\/p> <div class=\"card\"> <p><strong>Immediate Retreat:<\/strong> Do not attempt physical restraint. Immediately leave the residence and move to a safe, public location.<\/p> <p><strong>Contact Emergency Services (911):<\/strong> Once safely clear of the hazard, dial 911 to report violence, weapons, or physical threats.<\/p> <p><strong>Notify Agency Supervision:<\/strong> Immediately inform the agency supervisor or clinical manager regarding the safety incident.<\/p> <\/div> <h2>5. Incident Reporting &amp; Zero Tolerance Policy<\/h2> <div class=\"card\"> <p><strong>Zero-Tolerance Commitment:<\/strong> Complete Home Care Services maintains zero tolerance for threats, physical assault, harassment, or verbal abuse.<\/p> <p><strong>Mandatory Incident Logging:<\/strong> Every incident\u2014regardless of how minor\u2014must be documented on an official Incident Report within 24 hours.<\/p> <p><strong>Non-Retaliation Guarantee:<\/strong> Employees who report safety hazards or violence are fully protected against retaliation under state and federal labor laws.<\/p> <\/div>"
   },
   {
    "type": "lesson",
    "title": "6. Field Safety Checkpoints",
    "html": "<p>Follow these essential precautions before and during every home visit:<\/p> <div class=\"card\"> <p><strong>1. Pre-Visit Assessment:<\/strong> Review patient care plans for noted behavioral triggers or safety alerts before arriving.<\/p> <p><strong>2. Dynamic Awareness:<\/strong> Survey surroundings upon arrival. Park in well-lit areas with clear vehicle access.<\/p> <p><strong>3. Keep Devices Charged:<\/strong> Carry a fully charged mobile phone at all times for emergency communication.<\/p> <p><strong>4. Trust Instincts:<\/strong> If a home environment feels unsafe upon entry, retreat immediately and contact supervision.<\/p> <\/div>"
   },

   {
    "type": "lesson",
    "title": "Recognizing Escalation: Warning Signs",
    "html": "<p>Violence rarely comes out of nowhere. Most incidents are preceded by warning signs. Learning to spot them gives you time to step back and get safe.<\/p>\n<div class=\"g-steps letters\">\n<div data-k=\"S\"><h4>Staring<\/h4><p>Prolonged eye contact or a fixed, glaring stare.<\/p><\/div>\n<div data-k=\"T\"><h4>Tone<\/h4><p>A raised, sharp, or sarcastic voice, or sudden silence.<\/p><\/div>\n<div data-k=\"A\"><h4>Anxiety<\/h4><p>Sweating, rapid breathing, a flushed face, clenched fists.<\/p><\/div>\n<div data-k=\"M\"><h4>Mumbling<\/h4><p>Muttering, swearing under their breath, or making threats.<\/p><\/div>\n<div data-k=\"P\"><h4>Pacing<\/h4><p>Restless walking, moving into your space, or blocking the door.<\/p><\/div>\n<\/div>\n<div class=\"g-table-wrap\"><table class=\"g-table\"><tr><th>Stage<\/th><th>What you see<\/th><th>What you do<\/th><\/tr>\n<tr><td>\ud83d\udfe2 Calm<\/td><td>Normal behavior<\/td><td>Build rapport and explain your tasks.<\/td><\/tr>\n<tr><td>\ud83d\udfe1 Anxious<\/td><td>Restless, questioning, irritable<\/td><td>Listen, slow down, and offer choices.<\/td><\/tr>\n<tr><td>\ud83d\udfe0 Defensive<\/td><td>Arguing, shouting, refusing<\/td><td>Set calm limits, give space, and position yourself near the exit.<\/td><\/tr>\n<tr><td>\ud83d\udd34 Aggressive<\/td><td>Threats, throwing objects, physical action<\/td><td><strong>Leave immediately, call 911, then call the office.<\/strong><\/td><\/tr><\/table><\/div>\n<p>Causes in home care can include pain, dementia, delirium, medication side effects, alcohol or drug use, fear, grief, and family stress. Report new behaviors to your RN supervisor; they may be a medical problem.<\/p>"
   },
   {
    "type": "lesson",
    "title": "Verbal De-Escalation Techniques",
    "html": "<div class=\"g-do\">\n<div class=\"do\"><h4>Say and do<\/h4><ul><li>Use a calm, low, slow voice and the person's name.<\/li><li>\"I can see you're upset. Help me understand.\"<\/li><li>Acknowledge feelings without arguing about facts.<\/li><li>Offer simple choices: \"Would you like to sit here or by the window?\"<\/li><li>Keep at least 2 arm's lengths away, and stand at an angle.<\/li><li>Keep your hands open and visible.<\/li><\/ul><\/div>\n<div class=\"dont\"><h4>Avoid<\/h4><ul><li>Saying \"Calm down!\" or \"You have to...\"<\/li><li>Arguing, threatening, laughing, or making sudden moves.<\/li><li>Touching an agitated person without warning.<\/li><li>Standing between the person and the door, or letting them stand between you and yours.<\/li><li>Staying to \"win\" an argument.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"g-scenario\"><h4>What would you do?<\/h4><p>Mr. Diaz, who has dementia, becomes angry during his shave and shouts that you are stealing from him.<\/p>\n<details><summary>See the answer<\/summary><p>Stop the task. Step back, speak softly, and do not argue: \"I'm sorry this is upsetting. Let's take a break.\" Offer reassurance or a favorite activity, and try again later. Document and report the behavior to your RN. If he becomes physically aggressive, leave the room and call the office.<\/p><\/details><\/div>"
   },

   {
    "type": "lesson",
    "title": "Personal Safety Before & During Home Visits",
    "html": "<div class=\"g-icons\">\n<div><i>\ud83d\uddfa\ufe0f<\/i><h4>Before you go<\/h4><p>Know the address, the route, and any safety notes in the chart. Share your schedule with the office.<\/p><\/div>\n<div><i>\ud83d\udd0b<\/i><h4>Phone ready<\/h4><p>Fully charged, with the office and 911 easy to dial. Keep it on you, not in your bag.<\/p><\/div>\n<div><i>\ud83d\udeaa<\/i><h4>On arrival<\/h4><p>Observe the building and doorway. If you see fighting, weapons, or drug activity, do not enter. Leave and call.<\/p><\/div>\n<div><i>\ud83d\udc15<\/i><h4>Pets<\/h4><p>Ask that aggressive pets be secured in another room before you enter.<\/p><\/div>\n<div><i>\ud83d\udd2a<\/i><h4>Weapons<\/h4><p>If weapons are displayed or used to threaten, leave and report. The agency may require weapons to be stored away.<\/p><\/div>\n<div><i>\ud83d\udc5c<\/i><h4>Valuables<\/h4><p>Carry little cash and jewelry. Keep your bag closed and close to you.<\/p><\/div>\n<\/div>\n<div class=\"g-note\"><p>You always have the right to <strong>leave a visit where you feel unsafe<\/strong>. Go to a safe place and call the office right away so the patient's care can be arranged.<\/p><\/div>"
   },

    "type": "lesson",
    "title": "Domestic Violence, Harassment & Post-Incident Support",
    "html": "<p>You may witness abuse between household members, or experience harassment yourself (sexual comments, unwanted touching, racist slurs). These are workplace violence too.<\/p>\n<ul class=\"g-check\"><li>Never ignore abuse of a patient. Report suspected abuse, neglect, or exploitation to your supervisor immediately.<\/li><li>Report sexual harassment or unwanted touching by a patient or family member. You will not be punished for reporting.<\/li><li>Do not confront an abuser yourself. Your safety comes first.<\/li><li>After any incident: get medical care if needed, complete an incident report within 24 hours, and ask for support (Employee Assistance, debriefing with your supervisor).<\/li><li>The agency reviews every incident to improve safety plans, such as visiting in pairs or changing visit times.<\/li><\/ul>"

  "id": "measles",
  "title": "Measles & Hantavirus Infection Control & Clinical Safety",
  "summary": "Airborne precautions for measles, safe cleanup for hantavirus, PPE, exposure follow-up, and mandatory reporting.",
  "color": "#23784a",
  "icon": "virus",
  "minutes": 60,
  "endpoint": "",
  "driveFolder": "Measles & Hantavirus Infection Control & Clinical Safety",
  "intro": "<p>This interactive module covers transmission dynamics, clinical presentation, personal protective equipment (PPE), and infection control protocols for <strong>Measles (Rubeola)<\/strong> and <strong>Hantavirus Infections (HPS)<\/strong> in home care and community health settings.<\/p>",
  "steps": [
   {
    "type": "lesson",
    "title": "1. Measles (Rubeola): Pathogen & Transmission Dynamics",
    "html": "<p>Measles is an extremely contagious viral disease caused by the measles virus (a paramyxovirus). Understanding its high transmissibility is critical for frontline home care personnel.<\/p> <div class=\"card\"> <p><span class=\"term\">Airborne Transmission:<\/span> Measles spreads via airborne respiratory droplets when an infected person coughs or sneezes. The virus can remain infectious in suspension in the air for up to <strong>2 hours<\/strong> after the infected individual leaves the room.<\/p> <p><span class=\"term\">High Infectivity (R\u2080 12\u201318):<\/span> Measles is one of the most contagious known infectious diseases. Up to 90% of susceptible individuals close to an infected person will become infected.<\/p> <p><span class=\"term\">Contagious Window:<\/span> Patients are contagious from <strong>4 days before<\/strong> the onset of the characteristic maculopapular rash until <strong>4 days after<\/strong> the rash appears.<\/p> <p><span class=\"term\">Koplik Spots:<\/span> Tiny white spots with bluish-white centers found inside the mouth (buccal mucosa) appearing 1\u20132 days before the generalized rash.<\/p> <\/div>"
   },
   {
    "type": "check",
    "q": "How long can the Measles virus remain infectious in suspended air after an infected patient exits the room?",
    "options": [
     "15 minutes",
     "Up to 2 hours",
     "24 hours"
    ],
    "answer": 1
   },
   {
    "type": "lesson",
    "title": "2. Measles Clinical Presentation & Infection Control",
    "html": "<p>Early identification and immediate isolation protocols protect home health staff, caregivers, and vulnerable patient populations.<\/p> <div class=\"card\"> <p><strong>Clinical Manifestations (\"3 Cs\"):<\/strong> High fever accompanied by Cough, Coryza (runny nose), and Conjunctivitis (pink eye), followed by a red maculopapular rash spreading from head to trunk and limbs.<\/p> <p><strong>Airborne Precautions:<\/strong> Caregivers must use fit-tested <strong>N95 or higher respirators<\/strong>. Standard surgical masks do not afford adequate airborne protection.<\/p> <p><strong>Vaccination Verification:<\/strong> Immunity (two documented doses of MMR vaccine or positive IgG antibody titer) is mandatory for all personnel serving suspected or confirmed measles cases.<\/p> <p><strong>Immediate Reporting:<\/strong> Suspected cases must be reported immediately to the agency supervisor and local public health department.<\/p> <\/div> <h2>3. Hantavirus: Transmission &amp; Environmental Exposure<\/h2> <p>Hantavirus Pulmonary Syndrome (HPS) is a severe, sometimes fatal respiratory disease caused by hantaviruses carried by wild rodents (e.g., deer mice).<\/p> <div class=\"card\"> <p><strong>Aerosolization of Rodent Excreta:<\/strong> Infection occurs when people inhale airborne particles of dried rodent urine, droppings, or saliva stirred up during cleaning in infested home or outdoor structures.<\/p> <p><strong>No Human-to-Human Spread:<\/strong> In North America, hantavirus is <strong>not transmitted person-to-person<\/strong>. Care focuses on vector avoidance, safe environmental cleaning, and supportive care.<\/p> <p><strong>Incubation Period:<\/strong> Symptoms typically manifest 1 to 8 weeks after exposure to infected rodent excreta.<\/p> <\/div>"
   },
   {
    "type": "check",
    "q": "What is the primary mode of transmission for Hantavirus in home care environments?",
    "options": [
     "Person-to-person direct skin contact.",
     "Contaminated blood products.",
     "Inhalation of aerosolized dried rodent urine, droppings, or saliva."
    ],
    "answer": 2
   },
   {
    "type": "lesson",
    "title": "4. Safe Cleaning Protocols for Rodent Contaminated Areas",
    "html": "<p>To prevent aerosolizing Hantavirus particles, specific decontamination procedures must strictly be enforced:<\/p> <div class=\"card\"> <p><strong>NEVER Sweep or Vacuum:<\/strong> Dry sweeping or vacuuming rodent droppings/nesting materials aerosolizes virus particles into the air, creating severe inhalation risks.<\/p> <p><strong>Wet Disinfection Method:<\/strong> Thoroughly spray droppings and nests with a bleach solution (1 part household bleach to 9 parts water) or commercial disinfectant. Allow <strong>10 minutes contact time<\/strong> before wiping with paper towels.<\/p> <p><strong>PPE Requirements:<\/strong> Wear rubber/nitrile gloves, protective eyewear, disposable coveralls/gowns, and an N95 or higher respirator when cleaning infested areas.<\/p> <\/div> <h2>5. Comparative Protocol Matrix: Measles vs. Hantavirus<\/h2> <div class=\"card\"> <p><strong>Measles:<\/strong> Highly contagious human-to-human airborne virus. Requires strict airborne precautions (N95), MMR immunity verification, and immediate public health reporting.<\/p> <p><strong>Hantavirus:<\/strong> Zoonotic aerosolized rodent exposure. No human-to-human transmission. Requires wet-disinfection protocols, avoidance of dry sweeping, and rodent proofing.<\/p> <\/div>"
   },
   {
    "type": "lesson",
    "title": "6. Mandatory Reporting & Safety Compliance",
    "html": "<p>Adherence to public health laws and agency safety directives is essential for clinical operations:<\/p> <div class=\"card\"> <p><strong>Communicable Disease Reporting:<\/strong> Measles is a mandatory reportable disease under local state health codes. Report suspect cases immediately to agency clinical management.<\/p> <p><strong>Environmental Risk Escalation:<\/strong> When home health aides encounter heavy rodent infestations in client residences, escalate to agency supervisors for environmental remediation before conducting routine cleaning.<\/p> <p><strong>PPE Compliance:<\/strong> Never enter suspected airborne isolation areas (measles) or heavy rodent cleanup zones (hantavirus) without proper personal protective equipment.<\/p> <\/div>"

   {
    "type": "lesson",
    "title": "Measles Complications & Who Is Most at Risk",
    "html": "<div class=\"g-stats\">\n<div><b>9 in 10<\/b><span>Unvaccinated close contacts who become infected<\/span><\/div>\n<div><b>2 hrs<\/b><span>Virus stays in the air after the person leaves<\/span><\/div>\n<div><b>97%<\/b><span>Protection after 2 doses of MMR vaccine<\/span><\/div>\n<\/div>\n<div class=\"g-icons\">\n<div><i>\ud83e\udec1<\/i><h4>Pneumonia<\/h4><p>The most common cause of measles deaths in young children.<\/p><\/div>\n<div><i>\ud83e\udde0<\/i><h4>Encephalitis<\/h4><p>Brain swelling that can cause deafness, seizures, or intellectual disability.<\/p><\/div>\n<div><i>\ud83d\udc42<\/i><h4>Ear infections<\/h4><p>Can lead to permanent hearing loss.<\/p><\/div>\n<div><i>\ud83e\udd30<\/i><h4>Pregnancy<\/h4><p>Premature birth and low birth weight.<\/p><\/div>\n<div><i>\ud83d\udee1\ufe0f<\/i><h4>Weak immunity<\/h4><p>Patients on chemotherapy, transplant drugs, or with advanced HIV can have severe illness.<\/p><\/div>\n<div><i>\ud83d\udc74<\/i><h4>Older adults<\/h4><p>Those with chronic illness are at higher risk of complications.<\/p><\/div>\n<\/div>"
   },
   {
    "type": "lesson",
    "title": "Measles Exposure: What Happens Next",
    "html": "<div class=\"g-steps\">\n<div><h4>Report immediately<\/h4><p>If you cared for a patient later found to have measles, tell your supervisor the same day.<\/p><\/div>\n<div><h4>Check immunity<\/h4><p>The agency reviews your MMR records or blood test (titer).<\/p><\/div>\n<div><h4>Work restriction<\/h4><p>Staff without proof of immunity are excluded from work from day 5 through day 21 after exposure, per public health guidance.<\/p><\/div>\n<div><h4>Watch for symptoms<\/h4><p>Fever, cough, runny nose, and red eyes, followed by a rash. Stay home and call before going to a doctor's office or ER, so they can protect others.<\/p><\/div>\n<\/div>\n<div class=\"g-warn\"><p>Call ahead! A person with possible measles should <strong>never walk into a waiting room unannounced<\/strong>. Calling ahead lets the clinic prepare an isolation room.<\/p><\/div>"
   },
   {

    "q": "Why should a person with suspected measles call ahead before going to a clinic?",

   {
    "type": "lesson",
    "title": "Hantavirus: Recognizing Illness & Rodent-Proofing",
    "html": "<div class=\"g-table-wrap\"><table class=\"g-table\"><tr><th>Phase<\/th><th>Timing<\/th><th>Symptoms<\/th><\/tr>\n<tr><td>Early<\/td><td>1\u20138 weeks after exposure<\/td><td>Fever, fatigue, and <strong>muscle aches<\/strong> (thighs, hips, back), headache, dizziness, chills, nausea, vomiting, diarrhea<\/td><\/tr>\n<tr><td>Late<\/td><td>4\u201310 days after early symptoms<\/td><td>Cough, shortness of breath, and a tight chest as the lungs fill with fluid. <strong>Medical emergency.<\/strong><\/td><\/tr><\/table><\/div>\n<h3>Keep rodents out of the home (report needs to the supervisor)<\/h3>\n<ul class=\"g-check\"><li>Store food, including pet food, in sealed, rodent-proof containers.<\/li><li>Take out trash often in lidded cans. Wash dishes promptly.<\/li><li>Seal holes and gaps around pipes and doors (the landlord or building maintenance does this).<\/li><li>Remove clutter, woodpiles, and nesting materials near the home.<\/li><li>Air out closed spaces (sheds, basements) for 30 minutes before cleaning.<\/li><\/ul>"

    "title": "7. Best Practices & Operational Directives",
    "html": "<h3>Core Clinical Directives<\/h3> <ol> <li>Wear N95 respirators for suspected measles visits and rodent environmental cleanup.<\/li> <li>Never dry sweep or vacuum rodent excreta; always soak in disinfectant first.<\/li> <li>Verify MMR vaccination status prior to conducting home care for airborne infections.<\/li> <li>Immediately isolate patients showing signs of fever and maculopapular rash.<\/li> <li>Report all suspect cases and environmental hazards immediately to agency clinical supervisors.<\/li> <\/ol>"

 {
  "id": "lithium",
  "title": "Lithium Battery Safety & Fire Prevention",
  "summary": "Thermal runaway risks, safe charging and storage, e-bikes and medical devices, and fire emergency response.",
  "color": "#c9590f",
  "icon": "battery",
  "minutes": 60,
  "endpoint": "",
  "driveFolder": "Lithium Battery Safety & Fire Prevention",
  "intro": "<p>This interactive module covers lithium-ion battery hazards, thermal runaway risks, safe charging protocols, battery inspection, storage guidelines, and emergency fire response in healthcare and home settings.<\/p>",
  "steps": [
   {
    "type": "lesson",
    "title": "1. Understanding Lithium-Ion Battery Hazards",
    "html": "<p>Lithium-ion (Li-ion) batteries power medical equipment, laptops, tablets, and mobile devices. While efficient, damaged or misused batteries present severe fire, explosion, and toxic gas hazards.<\/p> <div class=\"card\"> <p><span class=\"term\">Thermal Runaway:<\/span> A rapid, uncontrollable chain reaction where internal cell failure generates extreme heat, causing violent venting, flammable gas release, and intense fire.<\/p> <p><span class=\"term\">Toxic Gas Off-Gassing:<\/span> Overheated or burning batteries emit dangerous toxic gases, including hydrogen fluoride, carbon monoxide, and volatile organic compounds.<\/p> <p><span class=\"term\">Re-Ignition Risk:<\/span> Lithium battery fires can reignite hours or days after initial suppression due to trapped heat within undamaged adjoining cells.<\/p> <p><span class=\"term\">Physical &amp; Electrical Abuse:<\/span> Crushing, puncturing, dropping, overcharging, or exposing batteries to extreme temperatures are leading causes of sudden battery failure.<\/p> <\/div>"
   },
   {
    "type": "check",
    "q": "What phenomenon occurs when internal lithium battery overheating triggers an uncontrollable self-sustaining fire?",
    "options": [
     "Electrical arcing",
     "Thermal runaway",
     "Static discharge"
    ],
    "answer": 1
   },
   {
    "type": "lesson",
    "title": "2. Safe Charging & Handling Practices",
    "html": "<p>Proper charging protocols prevent thermal buildup and prolong battery life in home and facility environments:<\/p> <div class=\"card\"> <p><strong>Use Manufacturer-Approved Chargers:<\/strong> Charge devices only with manufacturer-certified chargers and power cables. Uncertified aftermarket chargers lack essential thermal protection circuits.<\/p> <p><strong>Charge on Hard, Uncovered Surfaces:<\/strong> Place devices on flat, non-combustible surfaces during charging. Never charge devices on beds, pillows, couches, or under linens.<\/p> <p><strong>Avoid Overcharging:<\/strong> Unplug devices once fully charged. Avoid leaving devices plugged in unattended overnight or during prolonged absences.<\/p> <p><strong>Temperature Management:<\/strong> Never charge or store batteries in direct sunlight, hot vehicles, or near heating appliances.<\/p> <\/div> <h2>3. Battery Inspection &amp; Damage Recognition<\/h2> <p>Inspect medical and mobility device batteries before every shift or home visit:<\/p> <div class=\"card\"> <p><strong>Physical Damage Signals:<\/strong> Check for swelling, bulging, denting, cracking, or leaking fluid from the battery casing.<\/p> <p><strong>Thermal &amp; Odor Indicators:<\/strong> Discontinue use immediately if a battery feels excessively hot to the touch, emits a sweet chemical smell, or produces unusual ticking/hissing sounds.<\/p> <p><strong>Immediate Quarantine:<\/strong> Swollen or damaged batteries must be removed from service immediately and isolated in a fire-safe location.<\/p> <\/div>"
   },
   {
    "type": "check",
    "q": "Which surface is appropriate for charging lithium-ion powered equipment?",
    "options": [
     "A patient's bed or pillow.",
     "Under blankets on a couch.",
     "A hard, flat, non-combustible surface away from heat sources."
    ],
    "answer": 2
   },
   {
    "type": "lesson",
    "title": "4. Storage & Disposal Guidelines",
    "html": "<p>Safe storage prevents accidental short circuits and environmental contamination:<\/p> <div class=\"card\"> <p><strong>Terminal Protection:<\/strong> Tape battery contacts/terminals with non-conductive electrical tape before storage or recycling to prevent terminal contact shorting.<\/p> <p><strong>Never Household Trash:<\/strong> Lithium-ion batteries must NEVER be discarded in standard trash or recycling bins due to compaction fire risks in waste vehicles.<\/p> <p><strong>Designated Hazardous Waste Recycling:<\/strong> Dispose of damaged or depleted batteries through authorized e-waste recycling locations or facility hazardous waste channels.<\/p> <\/div> <h2>5. Emergency Fire Response Protocols<\/h2> <div class=\"card\"> <p><strong>Immediate Evacuation:<\/strong> If a battery begins smoking, off-gassing, or catching fire, evacuate the immediate room or residence immediately.<\/p> <p><strong>Call Emergency Services (911):<\/strong> Dial 911 right away. Inform firefighters that a lithium-ion battery fire is involved.<\/p> <p><strong>Fire Suppression &amp; Cooling:<\/strong> Use a Class ABC dry chemical fire extinguisher or copious amounts of water to cool surrounding combustibles if trained and safe to do so.<\/p> <\/div>"
   },
   {
    "type": "lesson",
    "title": "6. Field Safety Checkpoints",
    "html": "<p>Enforce these key battery safety checks on all work shifts:<\/p> <div class=\"card\"> <p><strong>1. Visual Inspection:<\/strong> Check device casings for swelling, heat, or crack marks before powering on.<\/p> <p><strong>2. Approved Power Supply:<\/strong> Confirm chargers match the device manufacturer's exact voltage specifications.<\/p> <p><strong>3. Safe Storage Zone:<\/strong> Store spare medical batteries in cool, dry rooms away from metallic items like keys or tools.<\/p> <p><strong>4. Immediate Quarantine:<\/strong> Never attempt to force a damaged battery into a charger or device port.<\/p> <\/div>"
   },
   {
    "type": "check",
    "q": "How should damaged or swollen lithium-ion batteries be discarded?",
    "options": [
     "Through designated e-waste hazardous recycling programs with taped terminals.",
     "In standard indoor trash cans.",
     "Mixed directly into regular paper recycling bins."
    ],
    "answer": 0
   },
   {
    "type": "lesson",
    "title": "E-Bikes, Scooters & Mobility Devices",
    "html": "<p>In New York City, lithium-ion battery fires from e-bikes and e-scooters have become a leading cause of deadly fires. Patients, family members, and delivery workers in the home may charge these devices.<\/p>\n<div class=\"g-stats\">\n<div><b>UL<\/b><span>Look for a UL 2849 (e-bike) or UL 2272 (scooter) certification mark<\/span><\/div>\n<div><b>Never<\/b><span>Charge them blocking a doorway or escape route<\/span><\/div>\n<div><b>Outside<\/b><span>Store and charge away from exits, ideally outside the living space<\/span><\/div>\n<\/div>\n<div class=\"g-do\">\n<div class=\"do\"><h4>Safe practices<\/h4><ul><li>Use only the manufacturer's charger and battery.<\/li><li>Charge on a hard, non-flammable surface while someone is awake and home.<\/li><li>Unplug once fully charged.<\/li><li>Let batteries cool after riding before charging.<\/li><\/ul><\/div>\n<div class=\"dont\"><h4>Red flags<\/h4><ul><li>Uncertified, rebuilt, or second-hand batteries.<\/li><li>Charging overnight or while no one is home.<\/li><li>Charging next to beds, curtains, or oxygen equipment.<\/li><li>Using extension cords or power strips.<\/li><\/ul><\/div>\n<\/div>\n<h3>Medical devices with lithium batteries<\/h3>\n<p>Power wheelchairs and scooters, portable oxygen concentrators, CPAP batteries, hearing aids, and phones all use lithium-ion batteries. Follow the supplier's charging instructions, and report damaged chargers or batteries to the supplier and your supervisor.<\/p>"
   },
   {
    "type": "lesson",
    "title": "Warning Signs of a Failing Battery",
    "html": "<div class=\"g-icons\">\n<div><i>\ud83c\udf88<\/i><h4>Swelling<\/h4><p>A bulging, puffy, or deformed case.<\/p><\/div>\n<div><i>\ud83c\udf21\ufe0f<\/i><h4>Overheating<\/h4><p>Too hot to touch while charging or in use.<\/p><\/div>\n<div><i>\ud83d\udc43<\/i><h4>Odor<\/h4><p>A sweet, chemical, or burning smell.<\/p><\/div>\n<div><i>\ud83d\udca8<\/i><h4>Smoke or hissing<\/h4><p>Hissing, popping, or crackling, or smoke from the device.<\/p><\/div>\n<div><i>\ud83d\udca7<\/i><h4>Leaking<\/h4><p>Fluid or residue around the battery.<\/p><\/div>\n<div><i>\ud83d\udd0b<\/i><h4>Won't hold charge<\/h4><p>Charges slowly, dies quickly, or shuts off.<\/p><\/div>\n<\/div>\n<div class=\"g-warn\"><p>If you see any of these: <strong>stop using it<\/strong>. If it is safe, unplug it and move people away. Do not touch a battery that is smoking or hot. Report it. Dispose of damaged batteries only at approved drop-off sites, never in household trash.<\/p><\/div>"
   },
   {
    "type": "check",
    "q": "Which is a warning sign that a lithium-ion battery may fail?",
    "options": [
     "It charges normally and stays cool.",
     "The battery case is swollen and gives off a chemical smell.",
     "It has a UL certification mark."
    ],
    "answer": 1
   },
   {
    "type": "lesson",
    "title": "Responding to a Battery Fire",

 {

  "title": "LGBTQIA+ Cultural Competency Training",
  "summary": "Respectful, person-directed care for patients of all sexual orientations and gender identities.",
  "color": "#6d4bb0",
  "icon": "heart",
  "minutes": 60,
  "endpoint": "",
  "driveFolder": "LGBTQIA+ Cultural Competency Training",
  "intro": "<p>This interactive training reviews respectful, person-directed care for patients of diverse sexual orientations and gender identities or expressions (SOGI).<\/p>",
  "steps": [
   {
    "type": "lesson",
    "title": "1. Core Terminology & Fundamental Concepts",
    "html": "<p>Understanding key terms allows healthcare personnel to communicate respectfully, foster trust, and avoid unintended harm or stigmatization when delivering patient-centered home and residential care.<\/p> <div class=\"card\"> <p><span class=\"term\">Lesbian:<\/span> A woman who is emotionally, romantically, or sexually attracted to other women.<\/p> <p><span class=\"term\">Gay:<\/span> A person who is emotionally, romantically, or sexually attracted to individuals of the same gender. Often used for men, but can apply universally across genders.<\/p> <p><span class=\"term\">Bisexual:<\/span> A person emotionally, romantically, or sexually attracted to more than one gender identity.<\/p> <p><span class=\"term\">Queer:<\/span> An umbrella term used by individuals whose sexual orientation or gender identity falls outside societal heterosexual or cisgender norms.<\/p> <p><span class=\"term\">Questioning:<\/span> An individual who is currently exploring or process-orienting their sexual orientation, gender identity, or gender expression.<\/p> <p><span class=\"term\">Intersex:<\/span> An umbrella term describing individuals born with physical, hormonal, or genetic sex characteristics that do not fit typical binary definitions of male or female bodies.<\/p> <p><span class=\"term\">Asexual:<\/span> A person who experiences low or no romantic/sexual attraction to others, or experiences it on a spectrum.<\/p> <p><span class=\"term\">Gender Non-Conforming:<\/span> A person whose gender expression does not conform to traditional societal gender expectations or stereotypes.<\/p> <p><span class=\"term\">Non-Binary:<\/span> An umbrella descriptor for individuals whose gender identity exists outside the traditional binary concept of male or female.<\/p> <\/div>"
   },
   {
    "type": "check",
    "q": "Why is understanding respectful terminology important in care?",
    "options": [
     "It allows staff to make assumptions about patients.",
     "It helps communicate respectfully, foster trust, and avoid unintended harm or stigmatization.",
     "It removes the need to ask patients about their preferences."
    ],
    "answer": 1
   },
   {
    "type": "lesson",
    "title": "2. Why Patients Conceal Their Identities",
    "html": "<p>Patients with diverse sexual orientations and gender identities or expressions (SOGI) often conceal their identities due to deeply rooted fears and past traumatic encounters with healthcare systems. Key factors include:<\/p> <div class=\"card\"> <p><strong>Fear of Substandard Care or Refusal of Service:<\/strong> Apprehension that disclosure may lead to neglect, verbal abuse, lower quality assistance, or outright refusal of home care services.<\/p> <p><strong>Historical Healthcare Trauma &amp; Discrimination:<\/strong> Experience with institutional bias, pathologization, or past mistreatment by medical professionals.<\/p> <p><strong>Vulnerability in Home Settings:<\/strong> Home care requires aides to enter personal spaces. Patients may fear loss of privacy, judgment, or breach of confidentiality within their own homes.<\/p> <p><strong>Fear of Isolation or Abandonment:<\/strong> Concerns that revealing their identity will alienate family caregivers, home health staff, or residential community peers.<\/p> <\/div> <h2>3. Person-Directed Care Integration<\/h2> <p>Person-directed care empowers each patient to remain the primary decision-maker in their care plan. Staff at Complete Home Care Services, Inc. must adhere to the following principles:<\/p> <div class=\"card\"> <p><strong>Self-Determination:<\/strong> Respect each patient's self-identified name, pronouns, family structure, and individual values.<\/p> <p><strong>Tailored Home Care Plans:<\/strong> Collaborate directly with the patient to structure daily activities, personal care routines, and assistance in ways that honor their dignity and individual preferences.<\/p> <p><strong>Empowerment in Choice:<\/strong> Provide unbiased information so patients can make informed health and lifestyle choices without feeling pressured to conform to traditional stereotypes.<\/p> <\/div>"
   },
   {
    "type": "check",
    "q": "Which action best reflects person-directed care?",
    "options": [
     "Using one standard care plan for every patient.",
     "Asking family members to make all decisions.",
     "Respecting the patient's self-identified name, pronouns, preferences, and values."
    ],
    "answer": 2
   },
   {
    "type": "lesson",
    "title": "4. Nursing Care & Residential Care Settings",
    "html": "<p>Staff working in residential, assisted living, or facility-based care settings must maintain heightened awareness regarding resident rights and community integration:<\/p> <div class=\"card\"> <p><strong>Privacy and Room Assignments:<\/strong> Respect room placement preferences according to gender identity, maintaining strict confidentiality regarding a resident's history or intersex status.<\/p> <p><strong>Protection from Peer Harassment:<\/strong> Actively safeguard LGBTQIA+ residents from bullying, ostracization, or hostile comments by other residents or staff.<\/p> <p><strong>Unrestricted Support Access:<\/strong> Ensure chosen family members, partners, and designated caregivers are granted equal visitation and decision-making access equal to traditional family members.<\/p> <\/div> <h2>5. Unique Needs of Older Adults<\/h2> <p>Older LGBTQIA+ adults represent a uniquely vulnerable population within long-term and home care environments:<\/p> <div class=\"card\"> <p><strong>Increased Social Isolation:<\/strong> Older LGBTQIA+ adults are twice as likely to live alone and four times less likely to have children than their non-LGBTQIA+ peers.<\/p> <p><strong>Re-closeting Risk:<\/strong> Many seniors who lived openly for decades feel forced back \"into the closet\" when receiving home health care or entering long-term care out of vulnerability.<\/p> <p><strong>Reliance on Chosen Family:<\/strong> Standard care protocols must recognize non-biological partners and \"chosen family\" as crucial caregivers and decision-makers.<\/p> <\/div>"
   },
   {
    "type": "lesson",
    "title": "6. Legal Rights & Anti-Discrimination Protections",
    "html": "<p>Under New York State Executive Law, NYS Human Rights Law, and federal regulations, patients have explicit legal rights:<\/p> <div class=\"card\"> <p><strong>Right to Non-Discriminatory Care:<\/strong> Prohibits denial of care, unequal treatment, or harassment based on actual or perceived sexual orientation, gender identity, or expression.<\/p> <p><strong>Right to Privacy &amp; Confidentiality (HIPAA):<\/strong> SOGI information is protected health data. Disclosure without explicit written consent is a illegal breach.<\/p> <p><strong>Right to Self-Identified Gender Representation:<\/strong> Patients have the legal right to be addressed by their chosen name and pronouns in all medical records and verbal interactions.<\/p> <\/div> <h2>7. Creating Welcoming &amp; Affirming Care Communities<\/h2> <p>A welcoming environment reduces patient anxiety and builds therapeutic trust:<\/p> <div class=\"card\"> <p><strong>Inclusive Physical &amp; Social Spaces:<\/strong> Display inclusive non-discrimination statements, diverse signage, and neutral forms in client-facing literature.<\/p> <p><strong>Active Allyship:<\/strong> Immediately correct non-affirming language or misgenderings when they occur, modeling inclusive communication for coworkers.<\/p> <p><strong>Support System Inclusion:<\/strong> Extend warm, respectful hospitality to partners, chosen families, and caregivers during care delivery.<\/p> <\/div> <h2>8. Gathering SOGI Information: Nuances &amp; Best Practices<\/h2> <p>Collecting Sexual Orientation and Gender Identity (SOGI) data is essential for addressing health disparities and tailoring clinical care:<\/p> <div class=\"card\"> <p><strong>Explain the Purpose:<\/strong> Frame questions clearly: \"We ask all patients about their name, pronouns, and orientation to ensure we provide personalized, respectful care.\"<\/p> <p><strong>Normalize Optional Disclosure:<\/strong> Never force disclosure. Allow patients to select \"Prefer not to answer\" or update their information at any time.<\/p> <p><strong>Age-Sensitive Communication:<\/strong> When working with older adults, use clear, non-jargon language, recognizing that older generations may use different self-descriptors (e.g., \"same-sex partner\" vs. \"queer\").<\/p> <\/div>"
   },

    "q": "What is the best approach when gathering SOGI information?",

   {
    "type": "lesson",
    "title": "Names, Pronouns & Respectful Language in Practice",
    "html": "<p>Using a person's correct name and pronouns is one of the simplest ways to show respect, and research shows it improves trust and health outcomes.<\/p>\n<div class=\"g-steps\">\n<div><h4>Introduce yourself<\/h4><p>\"Hi, I'm Maria, I use she/her pronouns. What name would you like me to use?\"<\/p><\/div>\n<div><h4>Check the record<\/h4><p>Look for the patient's chosen name and pronouns in the plan of care, and use them every time.<\/p><\/div>\n<div><h4>If you make a mistake<\/h4><p>Correct yourself briefly (\"Sorry, <em>he<\/em> wanted...\") and move on. Don't over-apologize.<\/p><\/div>\n<div><h4>Model it<\/h4><p>Use the correct name and pronouns with coworkers and family, even when the patient is not present.<\/p><\/div>\n<\/div>\n<div class=\"g-table-wrap\"><table class=\"g-table\"><tr><th>Instead of...<\/th><th>Try...<\/th><\/tr>\n<tr><td>\"Do you have a husband or wife?\"<\/td><td>\"Do you have a partner or spouse?\" or \"Who is important to you?\"<\/td><\/tr>\n<tr><td>\"What's your real name?\"<\/td><td>\"What name would you like me to use?\"<\/td><\/tr>\n<tr><td>\"He/she\" (guessing)<\/td><td>Ask, or use the person's name or \"they\" until you know<\/td><\/tr>\n<tr><td>\"That's a lifestyle choice\"<\/td><td>Avoid opinions. Focus on the person's care and comfort.<\/td><\/tr><\/table><\/div>"
   },
   {
    "type": "lesson",
    "title": "New York Protections: GENDA & the Human Rights Laws",
    "html": "<div class=\"g-icons two\">\n<div><i>\u2696\ufe0f<\/i><h4>NYS Human Rights Law<\/h4><p>Prohibits discrimination based on sexual orientation, gender identity, and gender expression in employment, housing, and public accommodations, including health care.<\/p><\/div>\n<div><i>\ud83c\udff3\ufe0f\u200d\u26a7\ufe0f<\/i><h4>GENDA (2019)<\/h4><p>The Gender Expression Non-Discrimination Act added gender identity and expression as protected classes under NYS law.<\/p><\/div>\n<div><i>\ud83c\udfd9\ufe0f<\/i><h4>NYC Human Rights Law<\/h4><p>Among the strongest in the nation. Refusing to use a person's name or pronouns, or harassing them, may be unlawful.<\/p><\/div>\n<div><i>\ud83e\ude7a<\/i><h4>Federal law<\/h4><p>Federal civil rights protections in health care also prohibit sex discrimination, including discrimination based on sexual orientation and gender identity.<\/p><\/div>\n<\/div>\n<div class=\"g-warn\"><p>Refusing care, mocking, \"outing\" a patient, or sharing their SOGI or HIV information can violate the law and agency policy, and can lead to termination.<\/p><\/div>"

   {

    "title": "Intimate Care, Body Differences & Health Needs",
    "html": "<p>Personal care is intimate for everyone. Transgender, non-binary, and intersex patients may have bodies that differ from what you expect, and may have experienced trauma in health care.<\/p>\n<ul class=\"g-check\"><li>Ask how the patient prefers to be helped with bathing, dressing, and toileting, and which words they use for their body.<\/li><li>Keep body parts covered and expose only the area you are working on.<\/li><li>Never react with surprise, comment on, or discuss a patient's body with others.<\/li><li>Gender-affirming hormones are medications. Report missed doses or side effects as you would any medication.<\/li><li>Older LGBTQIA+ adults may be living with HIV or have survived losses during the AIDS crisis. Offer compassion and protect their confidentiality.<\/li><li>Ask the patient who their chosen family is, and include those people as the patient wishes.<\/li><\/ul>\n<div class=\"g-scenario\"><h4>What would you do?<\/h4><p>During a bath you learn that your new patient, Ms. Rivera, is transgender. Her nephew later asks you, \"Is she really a woman?\"<\/p>\n<details><summary>See the answer<\/summary><p>Continue care exactly as you would for any patient, using her name and pronouns. Do not answer the nephew's question: \"I don't discuss anyone's personal or health information.\" Report concerns about harassment to your supervisor.<\/p><\/details><\/div>"

   {
    "type": "lesson",
    "title": "9. Respectfully Responding to Questions & Concerns",
    "html": "<p>When questions or misgivings arise from patients, families, or staff regarding SOGI topics, maintain absolute professionalism:<\/p> <div class=\"card\"> <p><strong>De-escalation &amp; Professional Boundaries:<\/strong> Maintain a calm, neutral, and empathetic tone. Never argue or express personal, political, or religious views.<\/p> <p><strong>Refocusing on Patient Care:<\/strong> Re-anchor discussions around agency standards: \"Our primary goal at Complete Home Care Services is to ensure every patient receives safe, respectful, high-quality care.\"<\/p> <p><strong>Reporting Concerns:<\/strong> Escalate any unresolved conflict, discrimination, or privacy violation immediately to agency supervision or HR.<\/p> <\/div> <h2>10. Summary of Best Practices for Affirming Care<\/h2> <h3>Core Directives for Aides &amp; Caregivers<\/h3> <ol> <li>Always address patients using their preferred name and correct pronouns.<\/li> <li>Maintain confidentiality and protect SOGI information in all home and agency settings.<\/li> <li>Incorporate the patient's individual preferences directly into their person-centered plan of care.<\/li> <li>Treat chosen family and partners with equal dignity, respect, and inclusion.<\/li> <li>Report any instances of bias, mistreatment, or harassment to management immediately.<\/li> <\/ol>"

 {
  "id": "maid",
  "title": "Medical Aid in Dying Clinical Protocols",
  "summary": "Legal safeguards, staff roles and boundaries, communication, and patient-directed end-of-life care for MAID.",
  "color": "#2f64a3",
  "icon": "hands",
  "minutes": 60,
  "endpoint": "",
  "driveFolder": "Medical Aid in Dying Clinical Protocols",
  "intro": "<p>This interactive module covers clinical guidelines, ethical frameworks, patient eligibility, legal requirements, and caregiving responsibilities regarding <strong>Medical Aid in Dying (MAID)<\/strong> in home care and end-of-life care settings.<\/p>",
  "steps": [
   {
    "type": "lesson",
    "title": "1. Fundamental Concepts & Statutory Definitions",
    "html": "<p>Medical Aid in Dying (MAID) allows a terminally ill, mentally capable adult to request and self-administer life-ending medication prescribed by a qualified physician.<\/p> <div class=\"card\"> <p><span class=\"term\">Self-Administration Requirement:<\/span> The patient must be physically capable of ingesting or self-administering the prescribed medication independently. Staff, caregivers, or family members are legally prohibited from administering the medication.<\/p> <p><span class=\"term\">Terminal Diagnosis Standard:<\/span> The patient must have an incurable, irreversible medical condition that will, within reasonable medical judgment, result in death within <strong>6 months<\/strong>.<\/p> <p><span class=\"term\">Voluntary Request:<\/span> The decision must originate solely from the patient, free from undue influence, coercion, or pressure from family or care staff.<\/p> <p><span class=\"term\">Decisional Capacity:<\/span> The patient must demonstrate decision-making capacity at the time of the initial request, prescription, and final administration.<\/p> <\/div>"
   },
   {
    "type": "check",
    "q": "Who is legally permitted to administer the prescribed MAID medication to the patient?",
    "options": [
     "The primary home health nurse or caregiver.",
     "Only the patient themselves (strict self-administration).",
     "A designated family proxy or health care agent."
    ],
    "answer": 1
   },
   {
    "type": "lesson",
    "title": "2. Statutory Safeguards & Clinical Requirements",
    "html": "<p>State jurisdictions maintaining MAID statutes enforce strict clinical safeguards to preserve patient autonomy and protect vulnerable populations.<\/p> <div class=\"card\"> <p><strong>Dual Physician Confirmation:<\/strong> Both an attending/prescribing physician and an independent consulting physician must separately verify the terminal diagnosis, prognosis, and decisional capacity.<\/p> <p><strong>Mandatory Waiting Periods:<\/strong> State regulations require specific statutory waiting periods between the initial oral request, written request, and issuance of the prescription.<\/p> <p><strong>Informed Consent Framework:<\/strong> Patients must be fully informed of all end-of-life care alternatives, including palliative care, hospice care, and pain management options.<\/p> <p><strong>Right to Rescind:<\/strong> The patient retains the absolute legal right to rescind or cancel their request at any point, regardless of previous statements or signed forms.<\/p> <\/div> <h2>3. Staff Roles &amp; Professional Boundaries<\/h2> <p>Home care staff must adhere strictly to professional standards and organizational policies regarding MAID participation:<\/p> <div class=\"card\"> <p><strong>Conscientious Objection Protections:<\/strong> Healthcare providers have the legal right to decline direct participation in MAID based on personal or moral beliefs without disciplinary penalty.<\/p> <p><strong>Supportive Non-Abandonment:<\/strong> While exercising conscientious objection, staff must ensure continuity of general supportive, hygiene, and palliative nursing care for the patient.<\/p> <p><strong>Strict Prohibition of Assistance:<\/strong> Home health aides and nurses must never mix, hold, feed, or directly physically assist in the ingestion of MAID pharmaceuticals.<\/p> <\/div>"
   },
   {
    "type": "check",
    "q": "What option does a patient retain after submitting all formal MAID requests and receiving the prescription?",
    "options": [
     "They must take the medication within 48 hours.",
     "They cannot alter their request once written forms are signed.",
     "They retain the absolute right to rescind or cancel their request at any time."
    ],
    "answer": 2
   },
   {
    "type": "lesson",
    "title": "4. Patient-Directed Care & Ethical Communication",
    "html": "<p>Delivering empathetic, unbiased care requires home health staff to maintain high ethical standards when discussing end-of-life choices:<\/p> <div class=\"card\"> <p><strong>Neutral Compassion:<\/strong> Respond to patient inquiries with objective factual information without offering personal judgments, political opinions, or religious views.<\/p> <p><strong>Confidentiality &amp; Privacy:<\/strong> All discussions, documentation, and care plans relating to MAID are confidential medical records protected under HIPAA laws.<\/p> <p><strong>Coordination with Hospice &amp; Palliative Care:<\/strong> Ensure seamless coordination with hospice teams to manage physical symptoms, pain control, and emotional support for both patient and family.<\/p> <\/div> <h2>5. Operational Guidelines &amp; Agency Protocol<\/h2> <div class=\"card\"> <p><strong>Reporting &amp; Escalation:<\/strong> Immediately notify clinical supervisors if a client initiates formal discussions regarding MAID or expresses interest in end-of-life options.<\/p> <p><strong>Documentation Requirements:<\/strong> Maintain thorough, objective clinical documentation regarding patient requests, physical assessment findings, and communications with the care team.<\/p> <\/div>"
   },
   {
    "type": "lesson",
    "title": "6. Summary of Care Directives for Field Staff",
    "html": "<p>Follow these essential clinical standards during patient interactions:<\/p> <div class=\"card\"> <p><strong>1. Respect Autonomy:<\/strong> Support the patient's self-determination and palliative end-of-life preferences.<\/p> <p><strong>2. Maintain Professional Boundaries:<\/strong> Do not physically assist in preparing or administering MAID medications.<\/p> <p><strong>3. Honor Conscientious Objection:<\/strong> Inform supervisors if personal beliefs prevent participation in MAID care management while continuing routine care.<\/p> <p><strong>4. Preserve Confidentiality:<\/strong> Keep all discussions and records confidential within the interdisciplinary clinical team.<\/p> <\/div>"
   },

   {
    "type": "lesson",
    "title": "Communicating with Patients & Families",
    "html": "<p>Conversations about dying are emotional. You do not need perfect words. You need to listen, stay neutral, and know when to refer.<\/p>\n<div class=\"g-do\">\n<div class=\"do\"><h4>Helpful phrases<\/h4><ul><li>\"That sounds like a lot to think about.\"<\/li><li>\"Would you like me to let your nurse know you want to talk about this?\"<\/li><li>\"I'm here with you. What would help you feel more comfortable right now?\"<\/li><li>\"I can't give advice about that, but your care team can answer your questions.\"<\/li><\/ul><\/div>\n<div class=\"dont\"><h4>Avoid<\/h4><ul><li>\"You shouldn't do that.\" or \"I would do it too.\"<\/li><li>Religious or moral arguments, in either direction.<\/li><li>Promising outcomes or timelines.<\/li><li>Discussing the patient's choice with other patients or neighbors.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"g-steps\">\n<div><h4>Listen<\/h4><p>Give your full attention. Silence is okay.<\/p><\/div>\n<div><h4>Acknowledge<\/h4><p>Name the feeling: worried, tired, afraid, relieved.<\/p><\/div>\n<div><h4>Refer<\/h4><p>Tell the RN supervisor the same day about any MAID question or request.<\/p><\/div>\n<div><h4>Document<\/h4><p>Record the patient's words factually, and who you notified.<\/p><\/div>\n<\/div>"
   },
   {
    "type": "lesson",
    "title": "Practice Scenarios",
    "html": "<div class=\"g-scenario\"><h4>Scenario 1<\/h4><p>A patient's son says, \"If you really cared about Dad, you'd help him take the medicine.\"<\/p>\n<details><summary>See the answer<\/summary><p>Stay calm and kind: \"I do care about your father. The law requires that only he can take the medication. I'll let the nurse know you'd like to talk.\" Notify the RN supervisor, and document the conversation.<\/p><\/details><\/div>\n<div class=\"g-scenario\"><h4>Scenario 2<\/h4><p>You find the prescribed MAID medication open on the night table while the patient is sleeping.<\/p>\n<details><summary>See the answer<\/summary><p>Do not touch, move, or dispose of it. Make sure no one else (children, visitors) can access the area if you can do so without handling it, and call your RN supervisor right away for instructions.<\/p><\/details><\/div>\n<div class=\"g-scenario\"><h4>Scenario 3<\/h4><p>The patient tells you, \"I've changed my mind. I don't want to go through with it.\"<\/p>\n<details><summary>See the answer<\/summary><p>Respect the decision. Patients may withdraw at any time. Offer support, and report the statement to the RN supervisor so the care team and prescriber can be informed.<\/p><\/details><\/div>"

   {
    "type": "lesson",
    "title": "Grief, Self-Care & Support for Staff",
    "html": "<p>Caring for a patient at the end of life, including one who chooses MAID, can bring strong feelings: sadness, relief, guilt, or moral distress. These reactions are normal.<\/p>\n<div class=\"g-icons\">\n<div><i>\ud83d\udde3\ufe0f<\/i><h4>Talk about it<\/h4><p>Debrief with your supervisor or a trusted coworker, while protecting confidentiality.<\/p><\/div>\n<div><i>\ud83e\uddd8<\/i><h4>Care for yourself<\/h4><p>Rest, eat well, move your body, and take time for faith or reflection.<\/p><\/div>\n<div><i>\ud83e\udd1d<\/i><h4>Use resources<\/h4><p>Ask about the Employee Assistance Program and bereavement support.<\/p><\/div>\n<div><i>\ud83d\udea9<\/i><h4>Know the signs<\/h4><p>Trouble sleeping, irritability, or dreading work may be signs of burnout or compassion fatigue.<\/p><\/div>\n<div><i>\ud83d\ude4b<\/i><h4>Ask for reassignment<\/h4><p>If your beliefs or feelings make the assignment too hard, tell your supervisor early. You will not be penalized.<\/p><\/div>\n<div><i>\ud83d\udd6f\ufe0f<\/i><h4>Honor the person<\/h4><p>Many caregivers find comfort in a small personal ritual of remembrance.<\/p><\/div>\n<\/div>"

    "title": "7. Best Practices & Operational Directives",
    "html": "<h3>Core Clinical Directives<\/h3> <ol> <li>Verify that the patient is making voluntary, independent decisions regarding end-of-life care.<\/li> <li>Never physically handle or administer prescribed MAID pharmaceuticals.<\/li> <li>Ensure hospice and palliative care interventions are fully utilized for comfort and symptom control.<\/li> <li>Report all client MAID inquiries to the clinical supervisor for appropriate interdisciplinary management.<\/li> <li>Maintain strict confidentiality and non-judgmental professional communication at all times.<\/li> <\/ol>"

  "driveFolder": "Cyclosporiasis Prevention, Identification & Reporting",
  "intro": "<p>This interactive module covers transmission dynamics, clinical presentation, laboratory testing, food safety prevention, and mandatory public health reporting for <strong>Cyclosporiasis<\/strong> in home care and clinical health settings.<\/p>",
  "steps": [
   {
    "type": "lesson",
    "title": "1. Pathogen Overview & Transmission Dynamics",
    "html": "<p>Cyclosporiasis is an intestinal illness caused by the microscopic parasite <em>Cyclospora cayetanensis<\/em>. Understanding its life cycle is essential for prevention and control.<\/p> <div class=\"card\"> <p><span class=\"term\">Food &amp; Waterborne Transmission:<\/span> Spread by consuming food or water contaminated with sporulated oocysts (e.g., fresh produce like berries, basil, cilantro, and pre-packaged salad mixes).<\/p> <p><span class=\"term\">No Direct Person-to-Person Spread:<\/span> Unsporulated oocysts shed in stool require <strong>1 to 2 weeks<\/strong> in the environment to mature and become infectious. Direct person-to-person transmission does not occur.<\/p> <p><span class=\"term\">Incubation Period:<\/span> Typically <strong>1 to 2 weeks<\/strong> (average ~7 days) between ingesting contaminated food/water and the onset of clinical symptoms.<\/p> <p><span class=\"term\">Seasonal Spikes:<\/span> Outbreaks occur most frequently during spring and summer months linked to fresh produce importation or local farm contamination.<\/p> <\/div>"
   },
   {
    "type": "check",
    "q": "Why is Cyclosporiasis NOT transmitted directly from person to person immediately following stool shedding?",
    "options": [
     "The parasite is killed immediately by air exposure.",
     "Shed oocysts require 1 to 2 weeks in the environment to mature and become infectious.",
     "It only infects animals, not humans."
    ],
    "answer": 1
   },
   {
    "type": "lesson",
    "title": "2. Clinical Identification & Symptoms",
    "html": "<p>Symptoms of Cyclosporiasis can be prolonged and remitting-relapsing if left untreated:<\/p> <div class=\"card\"> <p><strong>Primary Symptom:<\/strong> Profuse, watery diarrhea is the most prominent clinical manifestation.<\/p> <p><strong>Associated Clinical Features:<\/strong> Anorexia (loss of appetite), substantial weight loss, abdominal cramping, bloating, increased gas, nausea, fatigue, and low-grade fever.<\/p> <p><strong>Relapsing Course:<\/strong> If untreated, symptoms can persist from several weeks to over a month, characteristically waxing and waning in severity.<\/p> <p><strong>Vulnerable Populations:<\/strong> Immunocompromised individuals, older adults, and young children are at risk for severe dehydration and prolonged illness.<\/p> <\/div> <h2>3. Laboratory Testing &amp; Diagnosis<\/h2> <p>Standard stool tests for routine ova and parasites (O&amp;P) often miss <em>Cyclospora<\/em> unless specific testing is requested:<\/p> <div class=\"card\"> <p><strong>Specific Stool Testing:<\/strong> Clinicians must explicitly order stool examination for <em>Cyclospora<\/em> (e.g., modified acid-fast staining or gastrointestinal PCR panel).<\/p> <p><strong>Multiple Specimen Collection:<\/strong> Parasite shedding can be intermittent; collecting multiple stool specimens over several days improves diagnostic sensitivity.<\/p> <\/div>"
   },
   {
    "type": "check",
    "q": "What happens if Cyclosporiasis is left untreated in an infected individual?",
    "options": [
     "Symptoms always resolve completely within 24 hours.",
     "It immediately leads to permanent kidney failure.",
     "Symptoms can follow a relapsing course lasting from weeks to over a month."
    ],
    "answer": 2
   },
   {
    "type": "lesson",
    "title": "4. Prevention & Food Safety Protocols",
    "html": "<p>Because <em>Cyclospora<\/em> oocysts are resistant to chemical disinfectants like chlorine, strict physical food hygiene is required:<\/p> <div class=\"card\"> <p><strong>Thorough Washing of Produce:<\/strong> Wash all fresh fruits and vegetables thoroughly under running water before eating, cutting, or cooking.<\/p> <p><strong>Scrubbing Firm Produce:<\/strong> Scrub firm produce (e.g., melons, cucumbers) with a clean produce brush under running water.<\/p> <p><strong>Refrigeration &amp; Separation:<\/strong> Keep cut produce refrigerated at 40\u00b0F (4\u00b0C) or colder. Separate fresh produce from raw meat, poultry, and seafood.<\/p> <p><strong>Chemical Resistance Notice:<\/strong> Routine chlorine or alcohol washing solutions do not reliably eliminate <em>Cyclospora<\/em> oocysts; thorough mechanical washing and cooking are effective methods.<\/p> <\/div> <h2>5. Public Health Reporting &amp; Disease Surveillance<\/h2> <div class=\"card\"> <p><strong>Mandatory Reportable Disease:<\/strong> Cyclosporiasis is a reportable condition under state and national public health codes.<\/p> <p><strong>Immediate Notification:<\/strong> Confirmed or suspected cases must be reported immediately to the agency clinical supervisor and the local department of health.<\/p> <p><strong>Outbreak Investigation:<\/strong> Detailed food history tracking helps public health authorities identify contaminated commercial food sources and prevent outbreaks.<\/p> <\/div>"
   },
   {
    "type": "lesson",
    "title": "6. Clinical Field Directives for Caregivers",
    "html": "<p>Enforce these key infection control and reporting checkpoints during patient care:<\/p> <div class=\"card\"> <p><strong>1. Identify Persistent Diarrhea:<\/strong> Monitor home care clients for prolonged watery diarrhea and weight loss, notifying the primary nurse/physician.<\/p> <p><strong>2. Safe Produce Handling:<\/strong> Assist clients with proper food prep\u2014thoroughly washing fresh herbs, berries, and leafy greens under running water.<\/p> <p><strong>3. Hydration Support:<\/strong> Ensure clients with active diarrhea maintain adequate fluid and oral rehydration intake.<\/p> <p><strong>4. Prompt Escalation:<\/strong> Report suspected waterborne or foodborne gastrointestinal clusters to agency leadership.<\/p> <\/div>"
   },

   {
    "type": "lesson",
    "title": "Illness Timeline & Treatment",
    "html": "<div class=\"g-steps\">\n<div><h4>Exposure<\/h4><p>The person eats contaminated produce or drinks contaminated water.<\/p><\/div>\n<div><h4>Incubation: about 1 week<\/h4><p>Usually 2\u201314 days with no symptoms.<\/p><\/div>\n<div><h4>Illness<\/h4><p>Watery diarrhea, cramps, bloating, fatigue, and loss of appetite. Without treatment it can last weeks and may come and go.<\/p><\/div>\n<div><h4>Treatment<\/h4><p>A prescriber may order an antibiotic (commonly trimethoprim-sulfamethoxazole), plus fluids and rest.<\/p><\/div>\n<\/div>\n<div class=\"g-stats\">\n<div><b>~7 days<\/b><span>Average time from eating to illness<\/span><\/div>\n<div><b>Weeks<\/b><span>How long illness can last without treatment<\/span><\/div>\n<div><b>No<\/b><span>Alcohol hand rub or chlorine does not reliably kill oocysts<\/span><\/div>\n<\/div>\n<div class=\"g-warn\"><p>Signs of <strong>dehydration<\/strong> to report right away: very dark urine or little urine, dizziness when standing, dry mouth, confusion, or fast heartbeat. These are especially dangerous in older adults.<\/p><\/div>"

    "title": "Kitchen Hygiene for Caregivers",
    "html": "<figure class=\"g-fig\"><svg viewBox=\"0 0 560 150\" role=\"img\" aria-label=\"Handwashing takes at least 20 seconds\" font-family=\"system-ui,Segoe UI,Arial,sans-serif\">\n<rect x=\"20\" y=\"58\" width=\"520\" height=\"34\" rx=\"17\" fill=\"#e8eef1\"/>\n<rect x=\"20\" y=\"58\" width=\"80\" height=\"34\" rx=\"17\" fill=\"#1b7fa6\"/>\n<rect x=\"100\" y=\"58\" width=\"330\" height=\"34\" fill=\"#23784a\"/>\n<rect x=\"430\" y=\"58\" width=\"110\" height=\"34\" rx=\"17\" fill=\"#8a6100\"/>\n<g font-size=\"13\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">\n<text x=\"60\" y=\"80\">Wet + soap<\/text><text x=\"265\" y=\"80\">Scrub at least 20 seconds<\/text><text x=\"485\" y=\"80\">Rinse + dry<\/text><\/g>\n<g font-size=\"12\" fill=\"#5a6a76\" text-anchor=\"middle\">\n<text x=\"265\" y=\"118\">palms \u00b7 backs \u00b7 between fingers \u00b7 thumbs \u00b7 fingertips \u00b7 nails \u00b7 wrists<\/text>\n<text x=\"265\" y=\"40\" font-size=\"14\" font-weight=\"700\" fill=\"#15232d\">Tip: hum \"Happy Birthday\" twice<\/text>\n<text x=\"485\" y=\"118\">turn tap off with towel<\/text><\/g>\n<\/svg><figcaption>Wash hands with soap and water before preparing food and after toileting or diaper care.<\/figcaption><\/figure>\n<div class=\"g-do\">\n<div class=\"do\"><h4>Do<\/h4><ul><li>Wash produce under running water just before eating or cutting, even if you plan to peel it.<\/li><li>Rub soft produce such as berries and herbs gently under running water.<\/li><li>Use separate cutting boards for raw meat and for produce.<\/li><li>Wash cutting boards, counters, and utensils with hot soapy water after use.<\/li><li>Refrigerate cut produce within 2 hours.<\/li><\/ul><\/div>\n<div class=\"dont\"><h4>Don't<\/h4><ul><li>Soak produce in a sink full of water (this can spread contamination).<\/li><li>Use soap or bleach on produce.<\/li><li>Prepare food for others when you have diarrhea.<\/li><li>Rely on hand sanitizer before food prep.<\/li><\/ul><\/div>\n<\/div>"

    "html": "<div class=\"g-scenario\"><h4>What would you do?<\/h4><p>Your patient has had watery diarrhea on and off for 10 days, has lost her appetite, and says she feels \"wiped out.\" She recently ate a salad mix from a store that was in the news.<\/p>\n<details><summary>See the answer<\/summary><p>Report the symptoms and the food history to your RN supervisor the same day. The nurse may contact the patient's provider, who may order specific stool testing for <em>Cyclospora<\/em>. Encourage fluids as allowed. Use soap-and-water handwashing and standard precautions, and watch for signs of dehydration.<\/p><\/details><\/div>\n<div class=\"g-note\"><p>Saving packaging and receipts, or writing down what the patient ate in the past 2 weeks, helps public health investigators trace an outbreak to its source.<\/p><\/div>"
